[mod-description]
sa-music-on-nauvis=Spilet de soundtrack fan Space Age yn spultsjes dêr't de mod Space Age útskeakele is. De muzyk wurdt kopiearre út dyn eigen Space Age-ynstallaasje.

[mod-setting-name]
sa-music-shuffle=Muzyk willekeurich ôfspylje
sa-music-show-controls=Muzykbediening toane
sa-music-show-title=Namme fan it nûmer toane
sa-music-placement=Wêr't de muzyk spilet
sa-music-vulcanus=Muzyk fan Vulcanus
sa-music-fulgora=Muzyk fan Fulgora
sa-music-gleba=Muzyk fan Gleba
sa-music-aquilo=Muzyk fan Aquilo
sa-music-space=Muzyk fan romteplatfoarms
sa-music-hero=Heldenûmers

[mod-setting-description]
sa-music-shuffle=Oan: it spul kiest it folgjende nûmer willekeurich. Út: nûmers spylje yn albumfolchoarder. Itselde as de shuffleknop.
sa-music-show-controls=Knoppen Foarige, Folgjende, Shuffle, Stop en Muzyk dimpe linksboppe.
sa-music-show-title=Namme fan it nûmer dat spilet, neist de knoppen.
sa-music-placement=Allinnich Nauvis, of alle oerflakken (handich mei mods dy't eigen oerflakken tafoegje, lykas Space Exploration).
sa-music-vulcanus=De nûmers fan Vulcanus oan de ôfspyllist tafoegje.
sa-music-fulgora=De nûmers fan Fulgora oan de ôfspyllist tafoegje.
sa-music-gleba=De nûmers fan Gleba oan de ôfspyllist tafoegje.
sa-music-aquilo=De nûmers fan Aquilo oan de ôfspyllist tafoegje.
sa-music-space=De nûmers fan de romteplatfoarms oan de ôfspyllist tafoegje.
sa-music-hero=De fiif oankomstema's (ien per planeet en ien foar it romteplatfoarm), spile as gewoane nûmers. Los fan de planeetskeakels hjirboppe.

[string-mod-setting]
sa-music-placement-nauvis=Allinnich Nauvis
sa-music-placement-all-surfaces=Alle oerflakken

[sa-music]
no-music=(gjin muzyk)
variable=(fariabel)
previous=Foarich nûmer
next=Folgjend nûmer
shuffle-on=Shuffle: oan (it spul kiest nûmers willekeurich). Klik om yn albumfolchoarder te spyljen.
shuffle-off=Shuffle: út (nûmers spylje yn albumfolchoarder). Klik om te shufflen.
stop=Muzyk stopje. Druk op Ôfspylje om dit nûmer opnij te hearren.
play=It stoppe nûmer opnij fan it begjin ôf ôfspylje.
stopped=(stoppe)
mute-off=Muzyk dimpe. Der spilet gjin muzyk oant dy opnij klikst of op Foarige of Folgjende drukst.
mute-on=Muzyk is dimpe. Klik om wer muzyk te spyljen.
muted=(muzyk dimpe)
toggle=Muzykspiler. Klik om him te toanen of te ferbergjen.
