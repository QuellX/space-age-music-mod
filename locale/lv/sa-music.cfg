[mod-description]
sa-music-on-nauvis=Atskaņo Space Age skaņu celiņu spēlēs, kurās Space Age modifikācija ir atspējota. Mūzika tiek kopēta no tavas Space Age instalācijas.

[mod-setting-name]
sa-music-shuffle=Jaukt mūziku
sa-music-show-controls=Rādīt mūzikas vadīklas
sa-music-show-title=Rādīt skaņdarba nosaukumu
sa-music-placement=Kur atskaņot mūziku
sa-music-vulcanus=Vulkanus mūzika
sa-music-fulgora=Fulgoras mūzika
sa-music-gleba=Glebas mūzika
sa-music-aquilo=Akvilo mūzika
sa-music-space=Kosmosa platformu mūzika
sa-music-hero=Varoņu skaņdarbi

[mod-setting-description]
sa-music-shuffle=Ieslēgts: spēle nākamo skaņdarbu izvēlas nejauši. Izslēgts: skaņdarbi skan albuma secībā. Tas pats, kas jaukšanas poga.
sa-music-show-controls=Pogas Iepriekšējais, Nākamais, Jaukt, Apturēt un Izslēgt mūziku augšējā kreisajā stūrī.
sa-music-show-title=Skanošā skaņdarba nosaukums blakus pogām.
sa-music-placement=Tikai Nauvis vai visas virsmas (noderīgi ar modifikācijām, kas pievieno savas virsmas, piemēram, Space Exploration).
sa-music-vulcanus=Pievienot Vulkanus skaņdarbus atskaņošanas sarakstam.
sa-music-fulgora=Pievienot Fulgoras skaņdarbus atskaņošanas sarakstam.
sa-music-gleba=Pievienot Glebas skaņdarbus atskaņošanas sarakstam.
sa-music-aquilo=Pievienot Akvilo skaņdarbus atskaņošanas sarakstam.
sa-music-space=Pievienot kosmosa platformu skaņdarbus atskaņošanas sarakstam.
sa-music-hero=Piecas ierašanās tēmas (pa vienai katrai planētai un viena kosmosa platformai), atskaņotas kā parasti skaņdarbi. Neatkarīgi no augstāk esošajiem planētu slēdžiem.

[string-mod-setting]
sa-music-placement-nauvis=Tikai Nauvis
sa-music-placement-all-surfaces=Visas virsmas

[sa-music]
no-music=(nav mūzikas)
variable=(mainīgs)
previous=Iepriekšējais skaņdarbs
next=Nākamais skaņdarbs
shuffle-on=Jaukšana: ieslēgta (spēle izvēlas skaņdarbus nejauši). Noklikšķini, lai atskaņotu albuma secībā.
shuffle-off=Jaukšana: izslēgta (skaņdarbi skan albuma secībā). Noklikšķini, lai jauktu.
stop=Apturēt mūziku. Nospied Atskaņot, lai šo skaņdarbu dzirdētu vēlreiz.
play=Atskaņot apturēto skaņdarbu vēlreiz no sākuma.
stopped=(apturēts)
mute-off=Izslēgt mūziku. Mūzika neskanēs, kamēr neklikšķināsi vēlreiz vai nenospiedīsi Iepriekšējais vai Nākamais.
mute-on=Mūzika ir izslēgta. Noklikšķini, lai atkal atskaņotu mūziku.
muted=(mūzika izslēgta)
toggle=Mūzikas atskaņotājs. Noklikšķini, lai to parādītu vai paslēptu.
