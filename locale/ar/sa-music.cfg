[mod-description]
sa-music-on-nauvis=.كب صاخلا Space Age تيبثت نم ىقيسوملا خسنُت .اًلّطعم Space Age ليدعت اهيف نوكي يتلا باعلألا يف Space Age ىقيسوم لّغشي

[mod-setting-name]
sa-music-shuffle=اًيئاوشع ىقيسوملا ليغشت
sa-music-show-controls=ىقيسوملاب مكحتلا رصانع راهظإ
sa-music-show-title=ةعوطقملا مسا راهظإ
sa-music-placement=ىقيسوملا ليغشت ناكم
sa-music-vulcanus=Vulcanus ىقيسوم
sa-music-fulgora=اروغلوف ىقيسوم
sa-music-gleba=Gleba ىقيسوم
sa-music-aquilo=Aquilo ىقيسوم
sa-music-space=ءاضفلا تاصنم ىقيسوم
sa-music-hero=ةلوطبلا تاعوطقم

[mod-setting-description]
sa-music-shuffle=.يئاوشعلا ليغشتلا رز لثم .موبلألا بيترتب تاعوطقملا لَّغشُت :لّطعم .اًيئاوشع ةيلاتلا ةعوطقملا ةبعللا راتخت :لّعفم
sa-music-show-controls=.ىرسيلا ةيولعلا ةيوازلا يف ىقيسوملا متكو فاقيإلاو يئاوشعلاو يلاتلاو قباسلا رارزأ
sa-music-show-title=.رارزألا بناجب ليغشتلا ديق ةعوطقملا مسا
sa-music-placement=.(Space Exploration لثم ،ةصاخلا اهحطسأ فيضت يتلا تاليدعتلا عم ديفم) حطسألا لك ىلع وأ ،طقف Nauvis ىلع
sa-music-vulcanus=.ليغشتلا ةمئاق ىلإ Vulcanus تاعوطقم ةفاضإ
sa-music-fulgora=.ليغشتلا ةمئاق ىلإ اروغلوف تاعوطقم ةفاضإ
sa-music-gleba=.ليغشتلا ةمئاق ىلإ Gleba تاعوطقم ةفاضإ
sa-music-aquilo=.ليغشتلا ةمئاق ىلإ Aquilo تاعوطقم ةفاضإ
sa-music-space=.ليغشتلا ةمئاق ىلإ ءاضفلا تاصنم تاعوطقم ةفاضإ
sa-music-hero=.هالعأ بكاوكلا حيتافم نع لقتسم .ةيداع تاعوطقمك لَّغشُت ،(ءاضفلا ةصنمل دحاوو بكوك لكل دحاو) ةسمخلا لوصولا تاعوضوم

[string-mod-setting]
sa-music-placement-nauvis=طقف Nauvis
sa-music-placement-all-surfaces=حطسألا لك

[sa-music]
no-music=(ىقيسوم ال)
variable=(ةرّيغتم)
previous=ةقباسلا ةعوطقملا
next=ةيلاتلا ةعوطقملا
shuffle-on=.موبلألا بيترتب ليغشتلل رقنا .(اًيئاوشع تاعوطقملا ةبعللا راتخت) لّعفم :يئاوشعلا
shuffle-off=.طلخلل رقنا .(موبلألا بيترتب تاعوطقملا لَّغشُت) لّطعم :يئاوشعلا
stop=.اًددجم ةعوطقملا هذه عامسل ليغشت طغضا .ىقيسوملا فاقيإ
play=.ةيادبلا نم اًددجم ةفقوتملا ةعوطقملا ليغشت
stopped=(ةفقوتم)
mute-off=.يلاتلا وأ قباسلا طغضت وأ اًددجم رقنت ىتح ىقيسوم يأ لَّغشُت نل .ىقيسوملا متك
mute-on=.اًددجم ىقيسوملا ليغشتل رقنا .ةموتكم ىقيسوملا
muted=(ةموتكم ىقيسوملا)
toggle=.هئافخإ وأ هراهظإل رقنا .ىقيسوملا لّغشم
