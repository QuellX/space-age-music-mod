[mod-description]
sa-music-on-nauvis=Speel die Space Age-klankbaan in speletjies waar die Space Age-mod gedeaktiveer is. Die musiek word uit jou eie Space Age-installasie gekopieer.

[mod-setting-name]
sa-music-shuffle=Skommel musiek
sa-music-show-controls=Wys musiekkontroles
sa-music-show-title=Wys snitnaam
sa-music-placement=Waar om die musiek te speel
sa-music-vulcanus=Vulcanus-musiek
sa-music-fulgora=Fulgora-musiek
sa-music-gleba=Gleba-musiek
sa-music-aquilo=Aquilo-musiek
sa-music-space=Ruimteplatform-musiek
sa-music-hero=Heldesnitte

[mod-setting-description]
sa-music-shuffle=Aan: die speletjie kies die volgende snit willekeurig. Af: snitte speel in albumvolgorde. Dieselfde as die skommelknoppie.
sa-music-show-controls=Knoppies Vorige, Volgende, Skommel, Stop en Demp musiek in die boonste linkerhoek.
sa-music-show-title=Naam van die snit wat speel, langs die knoppies.
sa-music-placement=Net Nauvis, of elke oppervlak (nuttig met mods wat hul eie oppervlakke byvoeg, soos Space Exploration).
sa-music-vulcanus=Voeg die Vulcanus-snitte by die snitlys.
sa-music-fulgora=Voeg die Fulgora-snitte by die snitlys.
sa-music-gleba=Voeg die Gleba-snitte by die snitlys.
sa-music-aquilo=Voeg die Aquilo-snitte by die snitlys.
sa-music-space=Voeg die ruimteplatform-snitte by die snitlys.
sa-music-hero=Die vyf aankomstemas (een per planeet en een vir die ruimteplatform), as gewone snitte gespeel. Onafhanklik van die planeetskakelaars hierbo.

[string-mod-setting]
sa-music-placement-nauvis=Net Nauvis
sa-music-placement-all-surfaces=Alle oppervlakke

[sa-music]
no-music=(geen musiek)
variable=(veranderlik)
previous=Vorige snit
next=Volgende snit
shuffle-on=Skommel: aan (die speletjie kies snitte willekeurig). Klik om in albumvolgorde te speel.
shuffle-off=Skommel: af (snitte speel in albumvolgorde). Klik om te skommel.
stop=Stop die musiek. Druk Speel om hierdie snit weer te hoor.
play=Speel die gestopte snit weer van die begin af.
stopped=(gestop)
mute-off=Demp musiek. Geen musiek speel totdat jy weer klik of Vorige of Volgende druk nie.
mute-on=Musiek is gedemp. Klik om weer musiek te speel.
muted=(musiek gedemp)
toggle=Musiekspeler. Klik om dit te wys of te versteek.
