[mod-description]
sa-music-on-nauvis=Predvaja glasbo Space Age v igrah, kjer je mod Space Age onemogočen. Glasba se kopira iz tvoje lastne namestitve Space Age.

[mod-setting-name]
sa-music-shuffle=Naključna glasba
sa-music-show-controls=Prikaži upravljanje glasbe
sa-music-show-title=Prikaži ime skladbe
sa-music-placement=Kje predvajati glasbo
sa-music-vulcanus=Glasba Vulcanusa
sa-music-fulgora=Glasba Fulgore
sa-music-gleba=Glasba Glebe
sa-music-aquilo=Glasba Aquila
sa-music-space=Glasba vesoljskih ploščadi
sa-music-hero=Junaške skladbe

[mod-setting-description]
sa-music-shuffle=Vklopljeno: igra naslednjo skladbo izbere naključno. Izklopljeno: skladbe se predvajajo po vrstnem redu albuma. Enako kot gumb za naključno predvajanje.
sa-music-show-controls=Gumbi Prejšnja, Naslednja, Naključno, Ustavi in Utišaj glasbo v zgornjem levem kotu.
sa-music-show-title=Ime skladbe, ki se predvaja, ob gumbih.
sa-music-placement=Samo Nauvis ali vse površine (uporabno z modi, ki dodajajo svoje površine, npr. Space Exploration).
sa-music-vulcanus=Dodaj skladbe Vulcanusa na seznam predvajanja.
sa-music-fulgora=Dodaj skladbe Fulgore na seznam predvajanja.
sa-music-gleba=Dodaj skladbe Glebe na seznam predvajanja.
sa-music-aquilo=Dodaj skladbe Aquila na seznam predvajanja.
sa-music-space=Dodaj skladbe vesoljskih ploščadi na seznam predvajanja.
sa-music-hero=Pet tem prihoda (ena za vsak planet in ena za vesoljsko ploščad), predvajanih kot običajne skladbe. Neodvisno od stikal planetov zgoraj.

[string-mod-setting]
sa-music-placement-nauvis=Samo Nauvis
sa-music-placement-all-surfaces=Vse površine

[sa-music]
no-music=(ni glasbe)
variable=(spremenljiva)
previous=Prejšnja skladba
next=Naslednja skladba
shuffle-on=Naključno: vklopljeno (igra skladbe izbira naključno). Klikni za predvajanje po vrstnem redu albuma.
shuffle-off=Naključno: izklopljeno (skladbe se predvajajo po vrstnem redu albuma). Klikni za mešanje.
stop=Ustavi glasbo. Pritisni Predvajaj, da to skladbo spet slišiš.
play=Znova predvajaj ustavljeno skladbo od začetka.
stopped=(ustavljeno)
mute-off=Utišaj glasbo. Glasba se ne predvaja, dokler znova ne klikneš ali pritisneš Prejšnja ali Naslednja.
mute-on=Glasba je utišana. Klikni za ponovno predvajanje glasbe.
muted=(glasba utišana)
toggle=Glasbeni predvajalnik. Klikni, da ga prikažeš ali skriješ.
