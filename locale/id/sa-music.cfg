[mod-description]
sa-music-on-nauvis=Memutar soundtrack Space Age dalam permainan yang mod Space Age-nya dinonaktifkan. Musik disalin dari instalasi Space Age milikmu sendiri.

[mod-setting-name]
sa-music-shuffle=Acak musik
sa-music-show-controls=Tampilkan kontrol musik
sa-music-show-title=Tampilkan nama lagu
sa-music-placement=Tempat musik diputar
sa-music-vulcanus=Musik Vulcanus
sa-music-fulgora=Musik Fulgora
sa-music-gleba=Musik Gleba
sa-music-aquilo=Musik Aquilo
sa-music-space=Musik platform luar angkasa
sa-music-hero=Lagu pahlawan

[mod-setting-description]
sa-music-shuffle=Aktif: permainan memilih lagu berikutnya secara acak. Nonaktif: lagu diputar sesuai urutan album. Sama seperti tombol acak.
sa-music-show-controls=Tombol Sebelumnya, Berikutnya, Acak, Hentikan, dan Bisukan musik di pojok kiri atas.
sa-music-show-title=Nama lagu yang sedang diputar, di samping tombol.
sa-music-placement=Hanya Nauvis, atau semua permukaan (berguna dengan mod yang menambahkan permukaan sendiri, seperti Space Exploration).
sa-music-vulcanus=Tambahkan lagu Vulcanus ke daftar putar.
sa-music-fulgora=Tambahkan lagu Fulgora ke daftar putar.
sa-music-gleba=Tambahkan lagu Gleba ke daftar putar.
sa-music-aquilo=Tambahkan lagu Aquilo ke daftar putar.
sa-music-space=Tambahkan lagu platform luar angkasa ke daftar putar.
sa-music-hero=Lima tema kedatangan (satu untuk tiap planet dan satu untuk platform luar angkasa), diputar sebagai lagu biasa. Tidak bergantung pada sakelar planet di atas.

[string-mod-setting]
sa-music-placement-nauvis=Hanya Nauvis
sa-music-placement-all-surfaces=Semua permukaan

[sa-music]
no-music=(tidak ada musik)
variable=(variabel)
previous=Lagu sebelumnya
next=Lagu berikutnya
shuffle-on=Acak: aktif (permainan memilih lagu secara acak). Klik untuk memutar sesuai urutan album.
shuffle-off=Acak: nonaktif (lagu diputar sesuai urutan album). Klik untuk mengacak.
stop=Hentikan musik. Tekan Putar untuk mendengar lagu ini lagi.
play=Putar ulang lagu yang dihentikan dari awal.
stopped=(dihentikan)
mute-off=Bisukan musik. Tidak ada musik sampai kamu mengeklik lagi atau menekan Sebelumnya atau Berikutnya.
mute-on=Musik dibisukan. Klik untuk memutar musik lagi.
muted=(musik dibisukan)
toggle=Pemutar musik. Klik untuk menampilkan atau menyembunyikannya.
