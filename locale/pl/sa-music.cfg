[mod-description]
sa-music-on-nauvis=Odtwarza ścieżkę dźwiękową Space Age w grach, w których mod Space Age jest wyłączony. Muzyka jest kopiowana z twojej własnej instalacji Space Age.

[mod-setting-name]
sa-music-shuffle=Losowa muzyka
sa-music-show-controls=Pokaż sterowanie muzyką
sa-music-show-title=Pokaż nazwę utworu
sa-music-placement=Gdzie odtwarzać muzykę
sa-music-vulcanus=Muzyka Wulkanusa
sa-music-fulgora=Muzyka Fulgory
sa-music-gleba=Muzyka Gleby
sa-music-aquilo=Muzyka Akwilo
sa-music-space=Muzyka platform kosmicznych
sa-music-hero=Utwory bohaterskie

[mod-setting-description]
sa-music-shuffle=Wł.: gra wybiera następny utwór losowo. Wył.: utwory grają w kolejności albumu. To samo co przycisk losowania.
sa-music-show-controls=Przyciski Poprzedni, Następny, Losowo, Zatrzymaj i Wycisz muzykę w lewym górnym rogu.
sa-music-show-title=Nazwa odtwarzanego utworu obok przycisków.
sa-music-placement=Tylko Nauvis lub wszystkie powierzchnie (przydatne z modami dodającymi własne powierzchnie, np. Space Exploration).
sa-music-vulcanus=Dodaj utwory Wulkanusa do listy odtwarzania.
sa-music-fulgora=Dodaj utwory Fulgory do listy odtwarzania.
sa-music-gleba=Dodaj utwory Gleby do listy odtwarzania.
sa-music-aquilo=Dodaj utwory Akwilo do listy odtwarzania.
sa-music-space=Dodaj utwory platform kosmicznych do listy odtwarzania.
sa-music-hero=Pięć motywów przybycia (po jednym na planetę i jeden dla platformy kosmicznej), odtwarzanych jako zwykłe utwory. Niezależne od przełączników planet powyżej.

[string-mod-setting]
sa-music-placement-nauvis=Tylko Nauvis
sa-music-placement-all-surfaces=Wszystkie powierzchnie

[sa-music]
no-music=(brak muzyki)
variable=(zmienny)
previous=Poprzedni utwór
next=Następny utwór
shuffle-on=Losowo: wł. (gra wybiera utwory losowo). Kliknij, aby grać w kolejności albumu.
shuffle-off=Losowo: wył. (utwory grają w kolejności albumu). Kliknij, aby losować.
stop=Zatrzymaj muzykę. Naciśnij Odtwórz, aby znów usłyszeć ten utwór.
play=Odtwórz zatrzymany utwór ponownie od początku.
stopped=(zatrzymano)
mute-off=Wycisz muzykę. Muzyka nie gra, dopóki nie klikniesz ponownie lub nie naciśniesz Poprzedni albo Następny.
mute-on=Muzyka jest wyciszona. Kliknij, aby znów grała.
muted=(muzyka wyciszona)
toggle=Odtwarzacz muzyki. Kliknij, aby go pokazać lub ukryć.
