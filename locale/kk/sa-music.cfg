[mod-description]
sa-music-on-nauvis=Space Age моды өшірілген ойындарда Space Age саундтрегін ойнатады. Музыка сіздің Space Age орнатуыңыздан көшіріледі.

[mod-setting-name]
sa-music-shuffle=Музыканы араластыру
sa-music-show-controls=Музыка басқаруын көрсету
sa-music-show-title=Әуен атауын көрсету
sa-music-placement=Музыканы қай жерде ойнату
sa-music-vulcanus=Vulcanus музыкасы
sa-music-fulgora=Fulgora музыкасы
sa-music-gleba=Глеба музыкасы
sa-music-aquilo=Aquilo музыкасы
sa-music-space=Ғарыш платформаларының музыкасы
sa-music-hero=Батырлық әуендер

[mod-setting-description]
sa-music-shuffle=Қосулы: ойын келесі әуенді кездейсоқ таңдайды. Өшірулі: әуендер альбом ретімен ойналады. Араластыру түймесімен бірдей.
sa-music-show-controls=Алдыңғы, Келесі, Араластыру, Тоқтату және Музыканы өшіру түймелері жоғарғы сол жақ бұрышта.
sa-music-show-title=Ойналып жатқан әуеннің атауы түймелердің жанында.
sa-music-placement=Тек Наувыс немесе барлық беттер (Space Exploration сияқты өз беттерін қосатын модтармен пайдалы).
sa-music-vulcanus=Vulcanus әуендерін ойнату тізіміне қосу.
sa-music-fulgora=Fulgora әуендерін ойнату тізіміне қосу.
sa-music-gleba=Глеба әуендерін ойнату тізіміне қосу.
sa-music-aquilo=Aquilo әуендерін ойнату тізіміне қосу.
sa-music-space=Ғарыш платформаларының әуендерін ойнату тізіміне қосу.
sa-music-hero=Бес келу тақырыбы (әр планетаға және ғарыш платформасына біреуден), қарапайым әуендер ретінде ойналады. Жоғарыдағы планета қосқыштарына тәуелсіз.

[string-mod-setting]
sa-music-placement-nauvis=Тек Наувыс
sa-music-placement-all-surfaces=Барлық беттер

[sa-music]
no-music=(музыка жоқ)
variable=(айнымалы)
previous=Алдыңғы әуен
next=Келесі әуен
shuffle-on=Араластыру: қосулы (ойын әуендерді кездейсоқ таңдайды). Альбом ретімен ойнату үшін басыңыз.
shuffle-off=Араластыру: өшірулі (әуендер альбом ретімен ойналады). Араластыру үшін басыңыз.
stop=Музыканы тоқтату. Бұл әуенді қайта есту үшін Ойнату түймесін басыңыз.
play=Тоқтатылған әуенді басынан қайта ойнату.
stopped=(тоқтатылды)
mute-off=Музыканы өшіру. Қайта баспайынша немесе Алдыңғы не Келесі түймесін баспайынша музыка ойналмайды.
mute-on=Музыка өшірулі. Музыканы қайта қосу үшін басыңыз.
muted=(музыка өшірулі)
toggle=Музыка ойнатқышы. Көрсету немесе жасыру үшін басыңыз.
