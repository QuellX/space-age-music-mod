[mod-description]
sa-music-on-nauvis=Space Age modunun devre dışı olduğu oyunlarda Space Age müziklerini çalar. Müzik kendi Space Age kurulumunuzdan kopyalanır.

[mod-setting-name]
sa-music-shuffle=Müziği karıştır
sa-music-show-controls=Müzik kontrollerini göster
sa-music-show-title=Parça adını göster
sa-music-placement=Müziğin çalınacağı yer
sa-music-vulcanus=Vulcanus müziği
sa-music-fulgora=Fulgora müziği
sa-music-gleba=Gleba müziği
sa-music-aquilo=Aquilo müziği
sa-music-space=Uzay platformu müziği
sa-music-hero=Kahraman parçaları

[mod-setting-description]
sa-music-shuffle=Açık: oyun sonraki parçayı rastgele seçer. Kapalı: parçalar albüm sırasıyla çalar. Karıştır düğmesiyle aynıdır.
sa-music-show-controls=Sol üst köşede Önceki, Sonraki, Karıştır, Durdur ve Müziği sessize al düğmeleri.
sa-music-show-title=Çalan parçanın adı, düğmelerin yanında.
sa-music-placement=Yalnızca Nauvis veya tüm yüzeyler (Space Exploration gibi kendi yüzeylerini ekleyen modlarla kullanışlıdır).
sa-music-vulcanus=Vulcanus parçalarını çalma listesine ekle.
sa-music-fulgora=Fulgora parçalarını çalma listesine ekle.
sa-music-gleba=Gleba parçalarını çalma listesine ekle.
sa-music-aquilo=Aquilo parçalarını çalma listesine ekle.
sa-music-space=Uzay platformu parçalarını çalma listesine ekle.
sa-music-hero=Beş varış teması (her gezegen için bir ve uzay platformu için bir), normal parça olarak çalınır. Yukarıdaki gezegen anahtarlarından bağımsızdır.

[string-mod-setting]
sa-music-placement-nauvis=Yalnızca Nauvis
sa-music-placement-all-surfaces=Tüm yüzeyler

[sa-music]
no-music=(müzik yok)
variable=(değişken)
previous=Önceki parça
next=Sonraki parça
shuffle-on=Karıştır: açık (oyun parçaları rastgele seçer). Albüm sırasıyla çalmak için tıklayın.
shuffle-off=Karıştır: kapalı (parçalar albüm sırasıyla çalar). Karıştırmak için tıklayın.
stop=Müziği durdur. Bu parçayı yeniden duymak için Çal'a basın.
play=Durdurulan parçayı baştan yeniden çal.
stopped=(durduruldu)
mute-off=Müziği sessize al. Tekrar tıklayana ya da Önceki veya Sonraki'ye basana kadar müzik çalmaz.
mute-on=Müzik sessizde. Müziği yeniden çalmak için tıklayın.
muted=(müzik sessizde)
toggle=Müzik çalar. Göstermek veya gizlemek için tıklayın.
