[mod-description]
sa-music-on-nauvis=Воспроизводит саундтрек Space Age в играх, где мод Space Age отключён. Музыка копируется из вашей собственной установки Space Age.

[mod-setting-name]
sa-music-shuffle=Перемешивать музыку
sa-music-show-controls=Показывать управление музыкой
sa-music-show-title=Показывать название композиции
sa-music-placement=Где воспроизводить музыку
sa-music-vulcanus=Музыка Вулкана
sa-music-fulgora=Музыка Фульгоры
sa-music-gleba=Музыка Глебы
sa-music-aquilo=Музыка Аквило
sa-music-space=Музыка космических платформ
sa-music-hero=Героические композиции

[mod-setting-description]
sa-music-shuffle=Вкл.: игра выбирает следующую композицию случайно. Выкл.: композиции играют в порядке альбома. То же, что кнопка перемешивания.
sa-music-show-controls=Кнопки «Предыдущая», «Следующая», «Перемешать», «Стоп» и «Выключить музыку» в левом верхнем углу.
sa-music-show-title=Название играющей композиции рядом с кнопками.
sa-music-placement=Только на Наувисе или на всех поверхностях (полезно с модами, добавляющими свои поверхности, например Space Exploration).
sa-music-vulcanus=Добавить композиции Вулкана в список воспроизведения.
sa-music-fulgora=Добавить композиции Фульгоры в список воспроизведения.
sa-music-gleba=Добавить композиции Глебы в список воспроизведения.
sa-music-aquilo=Добавить композиции Аквило в список воспроизведения.
sa-music-space=Добавить композиции космических платформ в список воспроизведения.
sa-music-hero=Пять тем прибытия (по одной на каждую планету и космическую платформу), играющие как обычные композиции. Не зависит от переключателей планет выше.

[string-mod-setting]
sa-music-placement-nauvis=Только Наувис
sa-music-placement-all-surfaces=Все поверхности

[sa-music]
no-music=(нет музыки)
variable=(изменяемая)
previous=Предыдущая композиция
next=Следующая композиция
shuffle-on=Перемешивание: вкл. (игра выбирает композиции случайно). Нажмите, чтобы играть в порядке альбома.
shuffle-off=Перемешивание: выкл. (композиции играют в порядке альбома). Нажмите, чтобы перемешать.
stop=Остановить музыку. Нажмите «Воспроизвести», чтобы снова услышать эту композицию.
play=Снова воспроизвести остановленную композицию с начала.
stopped=(остановлено)
mute-off=Выключить музыку. Музыка не играет, пока вы не нажмёте снова или не нажмёте «Предыдущая» или «Следующая».
mute-on=Музыка выключена. Нажмите, чтобы снова включить.
muted=(музыка выключена)
toggle=Музыкальный проигрыватель. Нажмите, чтобы показать или скрыть его.
