[mod-description]
sa-music-on-nauvis=Toca a trilha sonora de Space Age em jogos onde o mod Space Age está desativado. A música é copiada da sua própria instalação do Space Age.

[mod-setting-name]
sa-music-shuffle=Música aleatória
sa-music-show-controls=Mostrar controles de música
sa-music-show-title=Mostrar nome da faixa
sa-music-placement=Onde tocar a música
sa-music-vulcanus=Música de Vulcanus
sa-music-fulgora=Música de Fulgora
sa-music-gleba=Música de Gleba
sa-music-aquilo=Música de Áquilo
sa-music-space=Música das plataformas espaciais
sa-music-hero=Faixas heroicas

[mod-setting-description]
sa-music-shuffle=Ligado: o jogo escolhe a próxima faixa aleatoriamente. Desligado: as faixas tocam na ordem do álbum. O mesmo que o botão de aleatório.
sa-music-show-controls=Botões Anterior, Próxima, Aleatório, Parar e Silenciar música no canto superior esquerdo.
sa-music-show-title=Nome da faixa que está tocando, ao lado dos botões.
sa-music-placement=Apenas Nauvis, ou todas as superfícies (útil com mods que adicionam suas próprias superfícies, como Space Exploration).
sa-music-vulcanus=Adicionar as faixas de Vulcanus à playlist.
sa-music-fulgora=Adicionar as faixas de Fulgora à playlist.
sa-music-gleba=Adicionar as faixas de Gleba à playlist.
sa-music-aquilo=Adicionar as faixas de Áquilo à playlist.
sa-music-space=Adicionar as faixas das plataformas espaciais à playlist.
sa-music-hero=Os cinco temas de chegada (um por planeta e um para a plataforma espacial), tocados como faixas normais. Independente dos interruptores de planetas acima.

[string-mod-setting]
sa-music-placement-nauvis=Apenas Nauvis
sa-music-placement-all-surfaces=Todas as superfícies

[sa-music]
no-music=(sem música)
variable=(variável)
previous=Faixa anterior
next=Próxima faixa
shuffle-on=Aleatório: ligado (o jogo escolhe as faixas aleatoriamente). Clique para tocar na ordem do álbum.
shuffle-off=Aleatório: desligado (as faixas tocam na ordem do álbum). Clique para embaralhar.
stop=Parar a música. Pressione Tocar para ouvir esta faixa de novo.
play=Tocar de novo a faixa parada desde o início.
stopped=(parada)
mute-off=Silenciar a música. Nenhuma música toca até você clicar de novo ou pressionar Anterior ou Próxima.
mute-on=A música está silenciada. Clique para tocar música de novo.
muted=(música silenciada)
toggle=Reprodutor de música. Clique para mostrar ou ocultar.
