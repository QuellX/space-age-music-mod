[mod-description]
sa-music-on-nauvis=უკრავს Space Age-ის საუნდტრეკს თამაშებში, სადაც Space Age მოდი გამორთულია. მუსიკა კოპირდება თქვენი საკუთარი Space Age-ის ინსტალაციიდან.

[mod-setting-name]
sa-music-shuffle=მუსიკის არევა
sa-music-show-controls=მუსიკის მართვის ჩვენება
sa-music-show-title=ტრეკის სახელის ჩვენება
sa-music-placement=სად დაუკრას მუსიკა
sa-music-vulcanus=ვულკანუსის მუსიკა
sa-music-fulgora=ფულგორას მუსიკა
sa-music-gleba=გლების მუსიკა
sa-music-aquilo=აკუილოს მუსიკა
sa-music-space=კოსმოსური პლატფორმების მუსიკა
sa-music-hero=გმირული ტრეკები

[mod-setting-description]
sa-music-shuffle=ჩართული: თამაში შემდეგ ტრეკს შემთხვევით ირჩევს. გამორთული: ტრეკები ალბომის თანმიმდევრობით უკრავს. იგივეა, რაც არევის ღილაკი.
sa-music-show-controls=ღილაკები წინა, შემდეგი, არევა, გაჩერება და მუსიკის დადუმება ზედა მარცხენა კუთხეში.
sa-music-show-title=მიმდინარე ტრეკის სახელი ღილაკების გვერდით.
sa-music-placement=მხოლოდ ნაუვისი ან ყველა ზედაპირი (სასარგებლოა მოდებთან, რომლებიც საკუთარ ზედაპირებს ამატებს, მაგ. Space Exploration).
sa-music-vulcanus=ვულკანუსის ტრეკების დამატება დასაკრავ სიაში.
sa-music-fulgora=ფულგორას ტრეკების დამატება დასაკრავ სიაში.
sa-music-gleba=გლების ტრეკების დამატება დასაკრავ სიაში.
sa-music-aquilo=აკუილოს ტრეკების დამატება დასაკრავ სიაში.
sa-music-space=კოსმოსური პლატფორმების ტრეკების დამატება დასაკრავ სიაში.
sa-music-hero=ხუთი ჩამოსვლის თემა (თითო თითოეულ პლანეტაზე და ერთი კოსმოსურ პლატფორმაზე), რომლებიც ჩვეულებრივ ტრეკებად უკრავს. დამოუკიდებელია ზემოთ მოცემული პლანეტების გადამრთველებისგან.

[string-mod-setting]
sa-music-placement-nauvis=მხოლოდ ნაუვისი
sa-music-placement-all-surfaces=ყველა ზედაპირი

[sa-music]
no-music=(მუსიკა არ არის)
variable=(ცვლადი)
previous=წინა ტრეკი
next=შემდეგი ტრეკი
shuffle-on=არევა: ჩართული (თამაში ტრეკებს შემთხვევით ირჩევს). დააწკაპუნეთ ალბომის თანმიმდევრობით დასაკრავად.
shuffle-off=არევა: გამორთული (ტრეკები ალბომის თანმიმდევრობით უკრავს). დააწკაპუნეთ ასარევად.
stop=მუსიკის გაჩერება. დააჭირეთ დაკვრას, რომ ეს ტრეკი ხელახლა მოისმინოთ.
play=გაჩერებული ტრეკის თავიდან დაკვრა.
stopped=(გაჩერებულია)
mute-off=მუსიკის დადუმება. მუსიკა არ დაუკრავს, სანამ ხელახლა არ დააწკაპუნებთ ან არ დააჭერთ წინას ან შემდეგს.
mute-on=მუსიკა დადუმებულია. დააწკაპუნეთ მუსიკის ხელახლა ჩასართავად.
muted=(მუსიკა დადუმებულია)
toggle=მუსიკის დამკვრელი. დააწკაპუნეთ საჩვენებლად ან დასამალად.
