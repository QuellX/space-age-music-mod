[mod-description]
sa-music-on-nauvis=Spiller lydsporet fra Space Age i spill der Space Age-modden er deaktivert. Musikken kopieres fra din egen Space Age-installasjon.

[mod-setting-name]
sa-music-shuffle=Tilfeldig musikk
sa-music-show-controls=Vis musikkontroller
sa-music-show-title=Vis navn på sporet
sa-music-placement=Hvor musikken spilles
sa-music-vulcanus=Musikk fra Vulcanus
sa-music-fulgora=Musikk fra Fulgora
sa-music-gleba=Musikk fra Gleba
sa-music-aquilo=Musikk fra Aquilo
sa-music-space=Musikk fra romplattformer
sa-music-hero=Heltespor

[mod-setting-description]
sa-music-shuffle=På: spillet velger neste spor tilfeldig. Av: sporene spilles i albumrekkefølge. Samme som tilfeldig-knappen.
sa-music-show-controls=Knappene Forrige, Neste, Tilfeldig, Stopp og Demp musikk øverst til venstre.
sa-music-show-title=Navnet på sporet som spilles, ved siden av knappene.
sa-music-placement=Bare Nauvis, eller alle overflater (nyttig med modder som legger til egne overflater, som Space Exploration).
sa-music-vulcanus=Legg til sporene fra Vulcanus i spillelisten.
sa-music-fulgora=Legg til sporene fra Fulgora i spillelisten.
sa-music-gleba=Legg til sporene fra Gleba i spillelisten.
sa-music-aquilo=Legg til sporene fra Aquilo i spillelisten.
sa-music-space=Legg til sporene fra romplattformene i spillelisten.
sa-music-hero=De fem ankomsttemaene (ett per planet og ett for romplattformen), spilt som vanlige spor. Uavhengig av planetbryterne over.

[string-mod-setting]
sa-music-placement-nauvis=Bare Nauvis
sa-music-placement-all-surfaces=Alle overflater

[sa-music]
no-music=(ingen musikk)
variable=(variabel)
previous=Forrige spor
next=Neste spor
shuffle-on=Tilfeldig: på (spillet velger spor tilfeldig). Klikk for å spille i albumrekkefølge.
shuffle-off=Tilfeldig: av (sporene spilles i albumrekkefølge). Klikk for å stokke.
stop=Stopp musikken. Trykk Spill av for å høre dette sporet igjen.
play=Spill av det stoppede sporet igjen fra begynnelsen.
stopped=(stoppet)
mute-off=Demp musikken. Ingen musikk spilles før du klikker igjen eller trykker Forrige eller Neste.
mute-on=Musikken er dempet. Klikk for å spille musikk igjen.
muted=(musikk dempet)
toggle=Musikkspiller. Klikk for å vise eller skjule den.
