[mod-description]
sa-music-on-nauvis=Space Age-ren soinu-banda jotzen du Space Age moda desgaituta dagoen partidetan. Musika zure Space Age instalaziotik kopiatzen da.

[mod-setting-name]
sa-music-shuffle=Ausazko musika
sa-music-show-controls=Erakutsi musika-kontrolak
sa-music-show-title=Erakutsi abestiaren izena
sa-music-placement=Non jo musika
sa-music-vulcanus=Vulcanusen musika
sa-music-fulgora=Fulgoraren musika
sa-music-gleba=Glebaren musika
sa-music-aquilo=Aquiloren musika
sa-music-space=Espazio-plataformen musika
sa-music-hero=Abesti heroikoak

[mod-setting-description]
sa-music-shuffle=Aktibatuta: jokoak hurrengo abestia ausaz aukeratzen du. Desaktibatuta: abestiak albumaren ordenan jotzen dira. Nahasketa-botoiaren berdina.
sa-music-show-controls=Aurrekoa, Hurrengoa, Nahastu, Gelditu eta Isilarazi musika botoiak goiko ezkerreko izkinan.
sa-music-show-title=Jotzen ari den abestiaren izena, botoien ondoan.
sa-music-placement=Nauvis soilik, edo gainazal guztiak (gainazal propioak gehitzen dituzten modekin erabilgarria, Space Exploration adibidez).
sa-music-vulcanus=Gehitu Vulcanusen abestiak erreprodukzio-zerrendara.
sa-music-fulgora=Gehitu Fulgoraren abestiak erreprodukzio-zerrendara.
sa-music-gleba=Gehitu Glebaren abestiak erreprodukzio-zerrendara.
sa-music-aquilo=Gehitu Aquiloren abestiak erreprodukzio-zerrendara.
sa-music-space=Gehitu espazio-plataformen abestiak erreprodukzio-zerrendara.
sa-music-hero=Iritsierako bost gaiak (planeta bakoitzeko bat eta espazio-plataformarako bat), abesti arrunt gisa joak. Goiko planeta-etengailuetatik independentea.

[string-mod-setting]
sa-music-placement-nauvis=Nauvis soilik
sa-music-placement-all-surfaces=Gainazal guztiak

[sa-music]
no-music=(musikarik ez)
variable=(aldakorra)
previous=Aurreko abestia
next=Hurrengo abestia
shuffle-on=Nahastu: aktibatuta (jokoak abestiak ausaz aukeratzen ditu). Egin klik albumaren ordenan jotzeko.
shuffle-off=Nahastu: desaktibatuta (abestiak albumaren ordenan jotzen dira). Egin klik nahasteko.
stop=Gelditu musika. Sakatu Erreproduzitu abesti hau berriro entzuteko.
play=Erreproduzitu berriro gelditutako abestia hasieratik.
stopped=(geldituta)
mute-off=Isilarazi musika. Ez da musikarik joko berriro klik egin arte edo Aurrekoa edo Hurrengoa sakatu arte.
mute-on=Musika isilarazita dago. Egin klik musika berriro jotzeko.
muted=(musika isilarazita)
toggle=Musika-erreproduzigailua. Egin klik erakusteko edo ezkutatzeko.
