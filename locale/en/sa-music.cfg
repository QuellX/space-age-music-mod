[mod-description]
sa-music-on-nauvis=Plays the Space Age soundtrack in games where the Space Age mod is disabled. The music is copied from your own Space Age installation.

[mod-setting-name]
sa-music-shuffle=Shuffle music
sa-music-show-controls=Show music controls
sa-music-show-title=Show track name
sa-music-placement=Where to play the music
sa-music-vulcanus=Vulcanus music
sa-music-fulgora=Fulgora music
sa-music-gleba=Gleba music
sa-music-aquilo=Aquilo music
sa-music-space=Space platform music
sa-music-hero=Hero tracks

[mod-setting-description]
sa-music-shuffle=On: the game picks the next track at random. Off: tracks play in album order. Same as the shuffle button.
sa-music-show-controls=Previous, Next and Shuffle buttons in the top-left corner.
sa-music-show-title=Name of the track that is playing, next to the buttons.
sa-music-placement=Nauvis only, or every surface (useful with mods that add their own surfaces, such as Space Exploration).
sa-music-vulcanus=Add the Vulcanus tracks to the playlist.
sa-music-fulgora=Add the Fulgora tracks to the playlist.
sa-music-gleba=Add the Gleba tracks to the playlist.
sa-music-aquilo=Add the Aquilo tracks to the playlist.
sa-music-space=Add the space platform tracks to the playlist.
sa-music-hero=The five arrival themes (one per planet and the space platform), played as regular tracks. Independent of the planet switches above.

[string-mod-setting]
sa-music-placement-nauvis=Nauvis only
sa-music-placement-all-surfaces=All surfaces

[sa-music]
no-music=(no music)
variable=(variable)
previous=Previous track
next=Next track
shuffle-on=Shuffle: on (the game picks tracks at random). Click to play in album order.
shuffle-off=Shuffle: off (tracks play in album order). Click to shuffle.
