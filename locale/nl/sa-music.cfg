[mod-description]
sa-music-on-nauvis=Speelt de soundtrack van Space Age in spellen waarin de mod Space Age is uitgeschakeld. De muziek wordt gekopieerd uit je eigen Space Age-installatie.

[mod-setting-name]
sa-music-shuffle=Muziek shufflen
sa-music-show-controls=Muziekbediening tonen
sa-music-show-title=Naam van nummer tonen
sa-music-placement=Waar de muziek speelt
sa-music-vulcanus=Muziek van Vulcanus
sa-music-fulgora=Muziek van Fulgora
sa-music-gleba=Muziek van Gleba
sa-music-aquilo=Muziek van Aquilo
sa-music-space=Muziek van ruimteplatforms
sa-music-hero=Heldennummers

[mod-setting-description]
sa-music-shuffle=Aan: het spel kiest het volgende nummer willekeurig. Uit: nummers spelen in albumvolgorde. Hetzelfde als de shuffleknop.
sa-music-show-controls=Knoppen Vorige, Volgende, Shuffle, Stop en Muziek dempen linksboven.
sa-music-show-title=Naam van het nummer dat speelt, naast de knoppen.
sa-music-placement=Alleen Nauvis, of alle oppervlakken (handig met mods die eigen oppervlakken toevoegen, zoals Space Exploration).
sa-music-vulcanus=De nummers van Vulcanus aan de afspeellijst toevoegen.
sa-music-fulgora=De nummers van Fulgora aan de afspeellijst toevoegen.
sa-music-gleba=De nummers van Gleba aan de afspeellijst toevoegen.
sa-music-aquilo=De nummers van Aquilo aan de afspeellijst toevoegen.
sa-music-space=De nummers van de ruimteplatforms aan de afspeellijst toevoegen.
sa-music-hero=De vijf aankomstthema's (één per planeet en één voor het ruimteplatform), gespeeld als gewone nummers. Los van de planeetschakelaars hierboven.

[string-mod-setting]
sa-music-placement-nauvis=Alleen Nauvis
sa-music-placement-all-surfaces=Alle oppervlakken

[sa-music]
no-music=(geen muziek)
variable=(variabel)
previous=Vorig nummer
next=Volgend nummer
shuffle-on=Shuffle: aan (het spel kiest nummers willekeurig). Klik om in albumvolgorde te spelen.
shuffle-off=Shuffle: uit (nummers spelen in albumvolgorde). Klik om te shufflen.
stop=Muziek stoppen. Druk op Afspelen om dit nummer opnieuw te horen.
play=Het gestopte nummer opnieuw vanaf het begin afspelen.
stopped=(gestopt)
mute-off=Muziek dempen. Er speelt geen muziek tot je opnieuw klikt of op Vorige of Volgende drukt.
mute-on=Muziek is gedempt. Klik om weer muziek af te spelen.
muted=(muziek gedempt)
toggle=Muziekspeler. Klik om hem te tonen of te verbergen.
