[mod-description]
sa-music-on-nauvis=Spelar Space Age-soundtracket i spel där Space Age-modden är avaktiverad. Musiken kopieras från din egen Space Age-installation.

[mod-setting-name]
sa-music-shuffle=Blanda musik
sa-music-show-controls=Visa musikkontroller
sa-music-show-title=Visa spårets namn
sa-music-placement=Var musiken spelas
sa-music-vulcanus=Musik från Vulkanus
sa-music-fulgora=Musik från Fulgora
sa-music-gleba=Musik från Gleba
sa-music-aquilo=Musik från Aquilo
sa-music-space=Musik från rymdplattformar
sa-music-hero=Hjältespår

[mod-setting-description]
sa-music-shuffle=På: spelet väljer nästa spår slumpmässigt. Av: spåren spelas i albumordning. Samma som blanda-knappen.
sa-music-show-controls=Knapparna Föregående, Nästa, Blanda, Stopp och Stäng av musik i övre vänstra hörnet.
sa-music-show-title=Namnet på spåret som spelas, bredvid knapparna.
sa-music-placement=Endast Nauvis, eller alla ytor (användbart med moddar som lägger till egna ytor, som Space Exploration).
sa-music-vulcanus=Lägg till spåren från Vulkanus i spellistan.
sa-music-fulgora=Lägg till spåren från Fulgora i spellistan.
sa-music-gleba=Lägg till spåren från Gleba i spellistan.
sa-music-aquilo=Lägg till spåren från Aquilo i spellistan.
sa-music-space=Lägg till spåren från rymdplattformarna i spellistan.
sa-music-hero=De fem ankomstteman (ett per planet och ett för rymdplattformen), spelade som vanliga spår. Oberoende av planetreglagen ovan.

[string-mod-setting]
sa-music-placement-nauvis=Endast Nauvis
sa-music-placement-all-surfaces=Alla ytor

[sa-music]
no-music=(ingen musik)
variable=(variabel)
previous=Föregående spår
next=Nästa spår
shuffle-on=Blanda: på (spelet väljer spår slumpmässigt). Klicka för att spela i albumordning.
shuffle-off=Blanda: av (spåren spelas i albumordning). Klicka för att blanda.
stop=Stoppa musiken. Tryck på Spela för att höra det här spåret igen.
play=Spela det stoppade spåret igen från början.
stopped=(stoppad)
mute-off=Stäng av musiken. Ingen musik spelas förrän du klickar igen eller trycker på Föregående eller Nästa.
mute-on=Musiken är avstängd. Klicka för att spela musik igen.
muted=(musik avstängd)
toggle=Musikspelare. Klicka för att visa eller dölja den.
