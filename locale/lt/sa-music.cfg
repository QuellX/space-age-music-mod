[mod-description]
sa-music-on-nauvis=Groja Space Age garso takelį žaidimuose, kuriuose Space Age modifikacija išjungta. Muzika nukopijuojama iš jūsų pačių Space Age diegimo.

[mod-setting-name]
sa-music-shuffle=Maišyti muziką
sa-music-show-controls=Rodyti muzikos valdiklius
sa-music-show-title=Rodyti kūrinio pavadinimą
sa-music-placement=Kur groti muziką
sa-music-vulcanus=Vulkanus muzika
sa-music-fulgora=Fulgoros muzika
sa-music-gleba=Glebos muzika
sa-music-aquilo=Akuilo muzika
sa-music-space=Kosmoso platformų muzika
sa-music-hero=Herojų kūriniai

[mod-setting-description]
sa-music-shuffle=Įjungta: žaidimas kitą kūrinį parenka atsitiktinai. Išjungta: kūriniai groja albumo tvarka. Tas pats, kas maišymo mygtukas.
sa-music-show-controls=Mygtukai Ankstesnis, Kitas, Maišyti, Sustabdyti ir Nutildyti muziką viršutiniame kairiajame kampe.
sa-music-show-title=Grojamo kūrinio pavadinimas šalia mygtukų.
sa-music-placement=Tik Nauvis arba visi paviršiai (naudinga su modifikacijomis, pridedančiomis savo paviršius, pvz., Space Exploration).
sa-music-vulcanus=Pridėti Vulkanus kūrinius į grojaraštį.
sa-music-fulgora=Pridėti Fulgoros kūrinius į grojaraštį.
sa-music-gleba=Pridėti Glebos kūrinius į grojaraštį.
sa-music-aquilo=Pridėti Akuilo kūrinius į grojaraštį.
sa-music-space=Pridėti kosmoso platformų kūrinius į grojaraštį.
sa-music-hero=Penkios atvykimo temos (po vieną kiekvienai planetai ir viena kosmoso platformai), grojamos kaip įprasti kūriniai. Nepriklauso nuo aukščiau esančių planetų jungiklių.

[string-mod-setting]
sa-music-placement-nauvis=Tik Nauvis
sa-music-placement-all-surfaces=Visi paviršiai

[sa-music]
no-music=(nėra muzikos)
variable=(kintamas)
previous=Ankstesnis kūrinys
next=Kitas kūrinys
shuffle-on=Maišymas: įjungtas (žaidimas kūrinius parenka atsitiktinai). Spustelėkite, kad grotų albumo tvarka.
shuffle-off=Maišymas: išjungtas (kūriniai groja albumo tvarka). Spustelėkite, kad maišytų.
stop=Sustabdyti muziką. Paspauskite Groti, kad vėl išgirstumėte šį kūrinį.
play=Vėl groti sustabdytą kūrinį nuo pradžios.
stopped=(sustabdyta)
mute-off=Nutildyti muziką. Muzika negros, kol vėl nespustelėsite arba nepaspausite Ankstesnis ar Kitas.
mute-on=Muzika nutildyta. Spustelėkite, kad vėl grotų muzika.
muted=(muzika nutildyta)
toggle=Muzikos grotuvas. Spustelėkite, kad jį parodytumėte arba paslėptumėte.
