[mod-description]
sa-music-on-nauvis=Redă coloana sonoră Space Age în jocurile în care modul Space Age este dezactivat. Muzica este copiată din propria ta instalare Space Age.

[mod-setting-name]
sa-music-shuffle=Muzică aleatorie
sa-music-show-controls=Afișează comenzile muzicii
sa-music-show-title=Afișează numele piesei
sa-music-placement=Unde se redă muzica
sa-music-vulcanus=Muzica de pe Vulcanus
sa-music-fulgora=Muzica de pe Fulgora
sa-music-gleba=Muzica de pe Gleba
sa-music-aquilo=Muzica de pe Aquilo
sa-music-space=Muzica platformelor spațiale
sa-music-hero=Piese eroice

[mod-setting-description]
sa-music-shuffle=Activat: jocul alege următoarea piesă la întâmplare. Dezactivat: piesele se redau în ordinea albumului. La fel ca butonul de redare aleatorie.
sa-music-show-controls=Butoanele Anterioară, Următoarea, Aleatoriu, Oprește și Dezactivează muzica în colțul din stânga sus.
sa-music-show-title=Numele piesei redate, lângă butoane.
sa-music-placement=Doar Nauvis sau toate suprafețele (util cu moduri care adaugă propriile suprafețe, precum Space Exploration).
sa-music-vulcanus=Adaugă piesele de pe Vulcanus în lista de redare.
sa-music-fulgora=Adaugă piesele de pe Fulgora în lista de redare.
sa-music-gleba=Adaugă piesele de pe Gleba în lista de redare.
sa-music-aquilo=Adaugă piesele de pe Aquilo în lista de redare.
sa-music-space=Adaugă piesele platformelor spațiale în lista de redare.
sa-music-hero=Cele cinci teme de sosire (câte una pentru fiecare planetă și una pentru platforma spațială), redate ca piese obișnuite. Independent de comutatoarele planetelor de mai sus.

[string-mod-setting]
sa-music-placement-nauvis=Doar Nauvis
sa-music-placement-all-surfaces=Toate suprafețele

[sa-music]
no-music=(fără muzică)
variable=(variabilă)
previous=Piesa anterioară
next=Piesa următoare
shuffle-on=Aleatoriu: activat (jocul alege piesele la întâmplare). Clic pentru redare în ordinea albumului.
shuffle-off=Aleatoriu: dezactivat (piesele se redau în ordinea albumului). Clic pentru amestecare.
stop=Oprește muzica. Apasă Redă pentru a auzi din nou această piesă.
play=Redă din nou piesa oprită de la început.
stopped=(oprită)
mute-off=Dezactivează muzica. Nu se redă muzică până nu dai clic din nou sau apeși Anterioară ori Următoarea.
mute-on=Muzica este dezactivată. Clic pentru a reda din nou muzică.
muted=(muzică dezactivată)
toggle=Player muzical. Clic pentru a-l afișa sau ascunde.
