[mod-description]
sa-music-on-nauvis=Spilar tónlist Space Age í leikjum þar sem Space Age-viðbótin er óvirk. Tónlistin er afrituð úr þinni eigin Space Age-uppsetningu.

[mod-setting-name]
sa-music-shuffle=Stokka tónlist
sa-music-show-controls=Sýna tónlistarstýringar
sa-music-show-title=Sýna heiti lags
sa-music-placement=Hvar tónlistin er spiluð
sa-music-vulcanus=Tónlist Vulcanus
sa-music-fulgora=Tónlist Fulgora
sa-music-gleba=Tónlist Gleba
sa-music-aquilo=Tónlist Aquilo
sa-music-space=Tónlist geimpalla
sa-music-hero=Hetjulög

[mod-setting-description]
sa-music-shuffle=Kveikt: leikurinn velur næsta lag af handahófi. Slökkt: lögin spilast í röð plötunnar. Sama og stokkunarhnappurinn.
sa-music-show-controls=Hnapparnir Fyrra, Næsta, Stokka, Stöðva og Þagga tónlist efst til vinstri.
sa-music-show-title=Heiti lagsins sem er í spilun, við hliðina á hnöppunum.
sa-music-placement=Aðeins Nauvis, eða allir fletir (gagnlegt með viðbótum sem bæta við eigin flötum, eins og Space Exploration).
sa-music-vulcanus=Bæta lögum Vulcanus við spilunarlistann.
sa-music-fulgora=Bæta lögum Fulgora við spilunarlistann.
sa-music-gleba=Bæta lögum Gleba við spilunarlistann.
sa-music-aquilo=Bæta lögum Aquilo við spilunarlistann.
sa-music-space=Bæta lögum geimpallanna við spilunarlistann.
sa-music-hero=Komustefin fimm (eitt fyrir hverja plánetu og eitt fyrir geimpallinn), spiluð sem venjuleg lög. Óháð plánetustillingunum hér að ofan.

[string-mod-setting]
sa-music-placement-nauvis=Aðeins Nauvis
sa-music-placement-all-surfaces=Allir fletir

[sa-music]
no-music=(engin tónlist)
variable=(breytilegt)
previous=Fyrra lag
next=Næsta lag
shuffle-on=Stokkun: kveikt (leikurinn velur lög af handahófi). Smelltu til að spila í röð plötunnar.
shuffle-off=Stokkun: slökkt (lögin spilast í röð plötunnar). Smelltu til að stokka.
stop=Stöðva tónlistina. Ýttu á Spila til að heyra þetta lag aftur.
play=Spila stöðvaða lagið aftur frá byrjun.
stopped=(stöðvað)
mute-off=Þagga tónlist. Engin tónlist spilast fyrr en þú smellir aftur eða ýtir á Fyrra eða Næsta.
mute-on=Tónlistin er þögguð. Smelltu til að spila tónlist aftur.
muted=(tónlist þögguð)
toggle=Tónlistarspilari. Smelltu til að sýna eða fela hann.
