[mod-description]
sa-music-on-nauvis=เล่นเพลงประกอบของ Space Age ในเกมที่ปิดม็อด Space Age ไว้ เพลงจะถูกคัดลอกจาก Space Age ที่คุณติดตั้งไว้เอง

[mod-setting-name]
sa-music-shuffle=สุ่มเพลง
sa-music-show-controls=แสดงตัวควบคุมเพลง
sa-music-show-title=แสดงชื่อเพลง
sa-music-placement=ตำแหน่งที่เล่นเพลง
sa-music-vulcanus=เพลงของ Vulcanus
sa-music-fulgora=เพลงของ Fulgora
sa-music-gleba=เพลงของ Gleba
sa-music-aquilo=เพลงของ Aquilo
sa-music-space=เพลงของแพลตฟอร์มอวกาศ
sa-music-hero=เพลงฮีโร่

[mod-setting-description]
sa-music-shuffle=เปิด: เกมจะสุ่มเลือกเพลงถัดไป ปิด: เล่นเพลงตามลำดับอัลบั้ม เหมือนกับปุ่มสุ่ม
sa-music-show-controls=ปุ่มก่อนหน้า ถัดไป สุ่ม หยุด และปิดเสียงเพลง ที่มุมซ้ายบน
sa-music-show-title=ชื่อเพลงที่กำลังเล่น ข้างปุ่ม
sa-music-placement=เฉพาะนาวิส หรือทุกพื้นผิว (มีประโยชน์กับม็อดที่เพิ่มพื้นผิวของตัวเอง เช่น Space Exploration)
sa-music-vulcanus=เพิ่มเพลงของ Vulcanus ลงในเพลย์ลิสต์
sa-music-fulgora=เพิ่มเพลงของ Fulgora ลงในเพลย์ลิสต์
sa-music-gleba=เพิ่มเพลงของ Gleba ลงในเพลย์ลิสต์
sa-music-aquilo=เพิ่มเพลงของ Aquilo ลงในเพลย์ลิสต์
sa-music-space=เพิ่มเพลงของแพลตฟอร์มอวกาศลงในเพลย์ลิสต์
sa-music-hero=ธีมการมาถึงทั้งห้า (ดาวละหนึ่งเพลงและแพลตฟอร์มอวกาศหนึ่งเพลง) เล่นเป็นเพลงปกติ ไม่ขึ้นกับสวิตช์ดาวเคราะห์ด้านบน

[string-mod-setting]
sa-music-placement-nauvis=เฉพาะนาวิส
sa-music-placement-all-surfaces=ทุกพื้นผิว

[sa-music]
no-music=(ไม่มีเพลง)
variable=(แปรผัน)
previous=เพลงก่อนหน้า
next=เพลงถัดไป
shuffle-on=สุ่ม: เปิด (เกมสุ่มเลือกเพลง) คลิกเพื่อเล่นตามลำดับอัลบั้ม
shuffle-off=สุ่ม: ปิด (เล่นตามลำดับอัลบั้ม) คลิกเพื่อสุ่ม
stop=หยุดเพลง กดเล่นเพื่อฟังเพลงนี้อีกครั้ง
play=เล่นเพลงที่หยุดไว้ใหม่ตั้งแต่ต้น
stopped=(หยุดแล้ว)
mute-off=ปิดเสียงเพลง จะไม่มีเพลงเล่นจนกว่าคุณจะคลิกอีกครั้งหรือกดก่อนหน้าหรือถัดไป
mute-on=ปิดเสียงเพลงอยู่ คลิกเพื่อเล่นเพลงอีกครั้ง
muted=(ปิดเสียงเพลง)
toggle=เครื่องเล่นเพลง คลิกเพื่อแสดงหรือซ่อน
