[mod-setting-description]
sa-music-shuffle=.یفداصت شخپ همکد دننام .دنوش‌یم شخپ موبلآ بیترت هب اه‌هعطق :شوماخ .دنک‌یم باختنا یفداصت ار یدعب هعطق یزاب :نشور
sa-music-show-controls=.پچ تمس الاب هشوگ رد یقیسوم ندرک ادص‌یب و فقوت ،یفداصت ،یدعب ،یلبق یاه‌همکد
sa-music-show-title=.اه‌همکد رانک ،شخپ لاح رد هعطق مان
sa-music-placement=.(Space Exploration دننام ،دننک‌یم هفاضا ار دوخ یاه‌حطس هک ییاهدام یارب دیفم) اه‌حطس همه ای ،سیوان طقف
sa-music-vulcanus=.شخپ تسرهف هب Vulcanus یاه‌هعطق ندوزفا
sa-music-fulgora=.شخپ تسرهف هب Fulgora یاه‌هعطق ندوزفا
sa-music-gleba=.شخپ تسرهف هب Gleba یاه‌هعطق ندوزفا
sa-music-aquilo=.شخپ تسرهف هب Aquilo یاه‌هعطق ندوزفا
sa-music-space=.شخپ تسرهف هب ییاضف یاهوکس یاه‌هعطق ندوزفا
sa-music-hero=.الاب رد اه‌هرایس یاهدیلک زا لقتسم .دنوش‌یم شخپ یداع یاه‌هعطق ناونع‌هب هک ،(ییاضف یوکس یارب یکی و هرایس ره یارب یکی) دورو مت جنپ

[string-mod-setting]
sa-music-placement-nauvis=سیوان طقف
sa-music-placement-all-surfaces=اه‌حطس همه

[sa-music]
no-music=(یقیسوم نودب)
variable=(ریغتم)
previous=یلبق هعطق
next=یدعب هعطق
shuffle-on=.دینک کیلک موبلآ بیترت هب شخپ یارب .(دنک‌یم باختنا یفداصت ار اه‌هعطق یزاب) نشور :یفداصت
shuffle-off=.دینک کیلک ندرک مهرد یارب .(دنوش‌یم شخپ موبلآ بیترت هب اه‌هعطق) شوماخ :یفداصت
stop=.دینزب ار شخپ ،هعطق نیا هرابود ندینش یارب .یقیسوم فقوت
play=.ادتبا زا هدش‌فقوتم هعطق هرابود شخپ
stopped=(دش فقوتم)
mute-off=.دوش‌یمن شخپ یقیسوم ،دینزن ار یدعب ای یلبق ای دینکن کیلک هرابود ات .یقیسوم ندرک ادص‌یب
mute-on=.دینک کیلک هرابود شخپ یارب .تسا ادص‌یب یقیسوم
muted=(ادص‌یب یقیسوم)
toggle=.دینک کیلک ندرک ناهنپ ای شیامن یارب .یقیسوم هدننک‌شخپ
