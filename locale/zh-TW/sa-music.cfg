[mod-description]
sa-music-on-nauvis=在停用 Space Age 模組的遊戲中播放 Space Age 原聲音樂。音樂從你自己安裝的 Space Age 中複製。

[mod-setting-name]
sa-music-shuffle=隨機播放音樂
sa-music-show-controls=顯示音樂控制
sa-music-show-title=顯示曲目名稱
sa-music-placement=音樂播放位置
sa-music-vulcanus=武卡努斯星音樂
sa-music-fulgora=弗戈拉星音樂
sa-music-gleba=葛萊芭星音樂
sa-music-aquilo=阿魁洛星音樂
sa-music-space=太空平台音樂
sa-music-hero=英雄曲目

[mod-setting-description]
sa-music-shuffle=開：遊戲隨機選擇下一首曲目。關：依專輯順序播放。與隨機播放按鈕相同。
sa-music-show-controls=左上角的上一首、下一首、隨機、停止與靜音音樂按鈕。
sa-music-show-title=在按鈕旁顯示正在播放的曲目名稱。
sa-music-placement=僅諾維斯星，或所有地表（適用於新增自有地表的模組，如 Space Exploration）。
sa-music-vulcanus=將武卡努斯星的曲目加入播放清單。
sa-music-fulgora=將弗戈拉星的曲目加入播放清單。
sa-music-gleba=將葛萊芭星的曲目加入播放清單。
sa-music-aquilo=將阿魁洛星的曲目加入播放清單。
sa-music-space=將太空平台的曲目加入播放清單。
sa-music-hero=五首抵達主題曲（每顆星球一首，太空平台一首），作為一般曲目播放。與上方的星球開關無關。

[string-mod-setting]
sa-music-placement-nauvis=僅諾維斯星
sa-music-placement-all-surfaces=所有地表

[sa-music]
no-music=（無音樂）
variable=（可變）
previous=上一首
next=下一首
shuffle-on=隨機播放：開（遊戲隨機選擇曲目）。點擊以依專輯順序播放。
shuffle-off=隨機播放：關（依專輯順序播放）。點擊以隨機播放。
stop=停止音樂。按播放可再次聆聽此曲目。
play=從頭重新播放已停止的曲目。
stopped=（已停止）
mute-off=靜音音樂。再次點擊或按上一首、下一首之前不會播放音樂。
mute-on=音樂已靜音。點擊以重新播放音樂。
muted=（音樂已靜音）
toggle=音樂播放器。點擊以顯示或隱藏。
