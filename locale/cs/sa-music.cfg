[mod-description]
sa-music-on-nauvis=Přehrává soundtrack Space Age ve hrách, kde je mód Space Age vypnutý. Hudba se kopíruje z tvé vlastní instalace Space Age.

[mod-setting-name]
sa-music-shuffle=Náhodná hudba
sa-music-show-controls=Zobrazit ovládání hudby
sa-music-show-title=Zobrazit název skladby
sa-music-placement=Kde hrát hudbu
sa-music-vulcanus=Hudba z Vulcanu
sa-music-fulgora=Hudba z Fulgory
sa-music-gleba=Hudba z Gleby
sa-music-aquilo=Hudba z Aquila
sa-music-space=Hudba vesmírných platforem
sa-music-hero=Hrdinské skladby

[mod-setting-description]
sa-music-shuffle=Zapnuto: hra vybírá další skladbu náhodně. Vypnuto: skladby hrají v pořadí alba. Stejné jako tlačítko náhodného přehrávání.
sa-music-show-controls=Tlačítka Předchozí, Další, Náhodně, Zastavit a Ztlumit hudbu v levém horním rohu.
sa-music-show-title=Název hrající skladby vedle tlačítek.
sa-music-placement=Pouze Nauvis, nebo všechny povrchy (užitečné s módy, které přidávají vlastní povrchy, např. Space Exploration).
sa-music-vulcanus=Přidat skladby z Vulcanu do seznamu skladeb.
sa-music-fulgora=Přidat skladby z Fulgory do seznamu skladeb.
sa-music-gleba=Přidat skladby z Gleby do seznamu skladeb.
sa-music-aquilo=Přidat skladby z Aquila do seznamu skladeb.
sa-music-space=Přidat skladby vesmírných platforem do seznamu skladeb.
sa-music-hero=Pět příletových témat (jedno pro každou planetu a jedno pro vesmírnou platformu), hraných jako běžné skladby. Nezávislé na přepínačích planet výše.

[string-mod-setting]
sa-music-placement-nauvis=Pouze Nauvis
sa-music-placement-all-surfaces=Všechny povrchy

[sa-music]
no-music=(žádná hudba)
variable=(proměnná)
previous=Předchozí skladba
next=Další skladba
shuffle-on=Náhodně: zapnuto (hra vybírá skladby náhodně). Klikni pro přehrávání v pořadí alba.
shuffle-off=Náhodně: vypnuto (skladby hrají v pořadí alba). Klikni pro zamíchání.
stop=Zastavit hudbu. Stiskni Přehrát a uslyšíš tuto skladbu znovu.
play=Přehrát zastavenou skladbu znovu od začátku.
stopped=(zastaveno)
mute-off=Ztlumit hudbu. Hudba nehraje, dokud znovu neklikneš nebo nestiskneš Předchozí či Další.
mute-on=Hudba je ztlumená. Klikni a hudba bude znovu hrát.
muted=(hudba ztlumena)
toggle=Hudební přehrávač. Klikni pro zobrazení nebo skrytí.
