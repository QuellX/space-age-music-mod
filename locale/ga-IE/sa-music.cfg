[mod-description]
sa-music-on-nauvis=Seinneann sé ceol Space Age i gcluichí ina bhfuil an mod Space Age díchumasaithe. Cóipeáiltear an ceol ó do shuiteáil féin de Space Age.

[mod-setting-name]
sa-music-shuffle=Ceol randamach
sa-music-show-controls=Taispeáin rialuithe ceoil
sa-music-show-title=Taispeáin ainm an rian
sa-music-placement=Cá seinnfear an ceol
sa-music-vulcanus=Ceol Vulcanus
sa-music-fulgora=Ceol Fulgora
sa-music-gleba=Ceol Gleba
sa-music-aquilo=Ceol Aquilo
sa-music-space=Ceol na n-ardán spáis
sa-music-hero=Rianta laochta

[mod-setting-description]
sa-music-shuffle=Air: roghnaíonn an cluiche an chéad rian eile go randamach. As: seinntear na rianta in ord an albaim. Mar an gcéanna leis an gcnaipe suaite.
sa-music-show-controls=Cnaipí Roimhe, Ar aghaidh, Suaite, Stop agus Balbhaigh an ceol sa chúinne uachtarach ar chlé.
sa-music-show-title=Ainm an rian atá á sheinm, in aice leis na cnaipí.
sa-music-placement=Nauvis amháin, nó gach dromchla (úsáideach le modanna a chuireann a ndromchlaí féin leis, mar Space Exploration).
sa-music-vulcanus=Cuir rianta Vulcanus leis an seinmliosta.
sa-music-fulgora=Cuir rianta Fulgora leis an seinmliosta.
sa-music-gleba=Cuir rianta Gleba leis an seinmliosta.
sa-music-aquilo=Cuir rianta Aquilo leis an seinmliosta.
sa-music-space=Cuir rianta na n-ardán spáis leis an seinmliosta.
sa-music-hero=Na cúig théama teachta (ceann do gach pláinéad agus ceann don ardán spáis), seinnte mar ghnáthrianta. Neamhspleách ar na lasca pláinéad thuas.

[string-mod-setting]
sa-music-placement-nauvis=Nauvis amháin
sa-music-placement-all-surfaces=Gach dromchla

[sa-music]
no-music=(gan cheol)
variable=(athraitheach)
previous=Rian roimhe
next=An chéad rian eile
shuffle-on=Suaite: air (roghnaíonn an cluiche rianta go randamach). Cliceáil chun seinm in ord an albaim.
shuffle-off=Suaite: as (seinntear na rianta in ord an albaim). Cliceáil chun suaitheadh.
stop=Stop an ceol. Brúigh Seinn chun an rian seo a chloisteáil arís.
play=Seinn an rian stoptha arís ón tús.
stopped=(stoptha)
mute-off=Balbhaigh an ceol. Ní sheinnfear ceol go gcliceálann tú arís nó go mbrúnn tú Roimhe nó Ar aghaidh.
mute-on=Tá an ceol balbhaithe. Cliceáil chun ceol a sheinm arís.
muted=(ceol balbhaithe)
toggle=Seinnteoir ceoil. Cliceáil chun é a thaispeáint nó a fholú.
