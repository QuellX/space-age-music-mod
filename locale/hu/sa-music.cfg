[mod-description]
sa-music-on-nauvis=Lejátssza a Space Age zenéjét olyan játékokban, ahol a Space Age mod ki van kapcsolva. A zene a saját Space Age telepítésedből kerül átmásolásra.

[mod-setting-name]
sa-music-shuffle=Véletlenszerű zene
sa-music-show-controls=Zenevezérlők megjelenítése
sa-music-show-title=Számcím megjelenítése
sa-music-placement=Hol szóljon a zene
sa-music-vulcanus=Vulcanus zenéje
sa-music-fulgora=Fulgora zenéje
sa-music-gleba=Gleba zenéje
sa-music-aquilo=Aquilo zenéje
sa-music-space=Űrplatformok zenéje
sa-music-hero=Hősi számok

[mod-setting-description]
sa-music-shuffle=Be: a játék véletlenszerűen választja a következő számot. Ki: a számok az album sorrendjében szólnak. Ugyanaz, mint a keverés gomb.
sa-music-show-controls=Előző, Következő, Keverés, Leállítás és Zene némítása gombok a bal felső sarokban.
sa-music-show-title=A szóló szám címe a gombok mellett.
sa-music-placement=Csak Nauvis vagy minden felszín (hasznos olyan modokkal, amelyek saját felszíneket adnak hozzá, például Space Exploration).
sa-music-vulcanus=Vulcanus számainak hozzáadása a lejátszási listához.
sa-music-fulgora=Fulgora számainak hozzáadása a lejátszási listához.
sa-music-gleba=Gleba számainak hozzáadása a lejátszási listához.
sa-music-aquilo=Aquilo számainak hozzáadása a lejátszási listához.
sa-music-space=Az űrplatformok számainak hozzáadása a lejátszási listához.
sa-music-hero=Az öt érkezési téma (bolygónként egy és egy az űrplatformhoz), normál számként lejátszva. Független a fenti bolygókapcsolóktól.

[string-mod-setting]
sa-music-placement-nauvis=Csak Nauvis
sa-music-placement-all-surfaces=Minden felszín

[sa-music]
no-music=(nincs zene)
variable=(változó)
previous=Előző szám
next=Következő szám
shuffle-on=Keverés: be (a játék véletlenszerűen választ számokat). Kattints az album sorrendjében való lejátszáshoz.
shuffle-off=Keverés: ki (a számok az album sorrendjében szólnak). Kattints a keveréshez.
stop=Zene leállítása. Nyomd meg a Lejátszás gombot, hogy újra halld ezt a számot.
play=A leállított szám újbóli lejátszása az elejétől.
stopped=(leállítva)
mute-off=Zene némítása. Nem szól zene, amíg újra nem kattintasz, vagy meg nem nyomod az Előző vagy Következő gombot.
mute-on=A zene némítva van. Kattints, hogy újra szóljon.
muted=(zene némítva)
toggle=Zenelejátszó. Kattints a megjelenítéséhez vagy elrejtéséhez.
