[mod-description]
sa-music-on-nauvis=Пушта музику из Space Age у играма у којима је мод Space Age искључен. Музика се копира из ваше сопствене инсталације Space Age.

[mod-setting-name]
sa-music-shuffle=Насумична музика
sa-music-show-controls=Прикажи контроле музике
sa-music-show-title=Прикажи назив песме
sa-music-placement=Где пуштати музику
sa-music-vulcanus=Музика са Вулкануса
sa-music-fulgora=Музика са Фулгоре
sa-music-gleba=Музика са Глебе
sa-music-aquilo=Музика са Аквила
sa-music-space=Музика свемирских платформи
sa-music-hero=Херојске песме

[mod-setting-description]
sa-music-shuffle=Укључено: игра насумично бира следећу песму. Искључено: песме иду редоследом албума. Исто као дугме за насумично пуштање.
sa-music-show-controls=Дугмад Претходна, Следећа, Насумично, Заустави и Утишај музику у горњем левом углу.
sa-music-show-title=Назив песме која свира, поред дугмади.
sa-music-placement=Само Наувис или све површине (корисно са модовима који додају своје површине, као што је Space Exploration).
sa-music-vulcanus=Додај песме са Вулкануса на листу за пуштање.
sa-music-fulgora=Додај песме са Фулгоре на листу за пуштање.
sa-music-gleba=Додај песме са Глебе на листу за пуштање.
sa-music-aquilo=Додај песме са Аквила на листу за пуштање.
sa-music-space=Додај песме свемирских платформи на листу за пуштање.
sa-music-hero=Пет тема доласка (по једна за сваку планету и једна за свемирску платформу), пуштане као обичне песме. Независно од прекидача планета изнад.

[string-mod-setting]
sa-music-placement-nauvis=Само Наувис
sa-music-placement-all-surfaces=Све површине

[sa-music]
no-music=(нема музике)
variable=(променљива)
previous=Претходна песма
next=Следећа песма
shuffle-on=Насумично: укључено (игра насумично бира песме). Кликните да пуштате редоследом албума.
shuffle-off=Насумично: искључено (песме иду редоследом албума). Кликните да промешате.
stop=Заустави музику. Притисните Пусти да поново чујете ову песму.
play=Поново пусти заустављену песму од почетка.
stopped=(заустављено)
mute-off=Утишај музику. Музика не свира док поново не кликнете или притиснете Претходна или Следећа.
mute-on=Музика је утишана. Кликните да поново свира.
muted=(музика утишана)
toggle=Музички плејер. Кликните да га прикажете или сакријете.
