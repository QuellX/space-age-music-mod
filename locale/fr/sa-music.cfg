[mod-description]
sa-music-on-nauvis=Joue la bande originale de Space Age dans les parties où le mod Space Age est désactivé. La musique est copiée depuis votre propre installation de Space Age.

[mod-setting-name]
sa-music-shuffle=Lecture aléatoire
sa-music-show-controls=Afficher les commandes de musique
sa-music-show-title=Afficher le nom du morceau
sa-music-placement=Où jouer la musique
sa-music-vulcanus=Musique de Vulcanus
sa-music-fulgora=Musique de Fulgora
sa-music-gleba=Musique de Gléba
sa-music-aquilo=Musique d'Aquilo
sa-music-space=Musique des plateformes spatiales
sa-music-hero=Morceaux héroïques

[mod-setting-description]
sa-music-shuffle=Activé : le jeu choisit le morceau suivant au hasard. Désactivé : les morceaux sont joués dans l'ordre de l'album. Identique au bouton de lecture aléatoire.
sa-music-show-controls=Boutons Précédent, Suivant, Aléatoire, Arrêt et Couper la musique en haut à gauche.
sa-music-show-title=Nom du morceau en cours, à côté des boutons.
sa-music-placement=Nauvis uniquement, ou toutes les surfaces (utile avec les mods qui ajoutent leurs propres surfaces, comme Space Exploration).
sa-music-vulcanus=Ajouter les morceaux de Vulcanus à la liste de lecture.
sa-music-fulgora=Ajouter les morceaux de Fulgora à la liste de lecture.
sa-music-gleba=Ajouter les morceaux de Gléba à la liste de lecture.
sa-music-aquilo=Ajouter les morceaux d'Aquilo à la liste de lecture.
sa-music-space=Ajouter les morceaux des plateformes spatiales à la liste de lecture.
sa-music-hero=Les cinq thèmes d'arrivée (un par planète et un pour la plateforme spatiale), joués comme des morceaux normaux. Indépendant des interrupteurs de planètes ci-dessus.

[string-mod-setting]
sa-music-placement-nauvis=Nauvis uniquement
sa-music-placement-all-surfaces=Toutes les surfaces

[sa-music]
no-music=(pas de musique)
variable=(variable)
previous=Morceau précédent
next=Morceau suivant
shuffle-on=Lecture aléatoire : activée (le jeu choisit les morceaux au hasard). Cliquez pour jouer dans l'ordre de l'album.
shuffle-off=Lecture aléatoire : désactivée (les morceaux sont joués dans l'ordre de l'album). Cliquez pour mélanger.
stop=Arrêter la musique. Appuyez sur Lecture pour réentendre ce morceau.
play=Rejouer le morceau arrêté depuis le début.
stopped=(arrêté)
mute-off=Couper la musique. Aucune musique ne joue jusqu'à ce que vous cliquiez à nouveau ou appuyiez sur Précédent ou Suivant.
mute-on=La musique est coupée. Cliquez pour la réactiver.
muted=(musique coupée)
toggle=Lecteur de musique. Cliquez pour l'afficher ou le masquer.
