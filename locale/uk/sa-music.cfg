[mod-description]
sa-music-on-nauvis=Відтворює саундтрек Space Age в іграх, де мод Space Age вимкнено. Музика копіюється з вашої власної інсталяції Space Age.

[mod-setting-name]
sa-music-shuffle=Перемішувати музику
sa-music-show-controls=Показувати керування музикою
sa-music-show-title=Показувати назву композиції
sa-music-placement=Де відтворювати музику
sa-music-vulcanus=Музика Вулкануса
sa-music-fulgora=Музика Фульґори
sa-music-gleba=Музика Ґлеби
sa-music-aquilo=Музика Аквіло
sa-music-space=Музика космічних платформ
sa-music-hero=Героїчні композиції

[mod-setting-description]
sa-music-shuffle=Увімк.: гра обирає наступну композицію випадково. Вимк.: композиції грають за порядком альбому. Те саме, що кнопка перемішування.
sa-music-show-controls=Кнопки "Попередня", "Наступна" і "Перемішати" у верхньому лівому куті.
sa-music-show-title=Назва композиції, що грає, поруч із кнопками.
sa-music-placement=Лише на Наувісі або на всіх поверхнях (корисно з модами, що додають власні поверхні, як-от Space Exploration).
sa-music-vulcanus=Додати композиції Вулкануса до списку відтворення.
sa-music-fulgora=Додати композиції Фульґори до списку відтворення.
sa-music-gleba=Додати композиції Ґлеби до списку відтворення.
sa-music-aquilo=Додати композиції Аквіло до списку відтворення.
sa-music-space=Додати композиції космічних платформ до списку відтворення.
sa-music-hero=П'ять тем прибуття (по одній на кожну планету й космічну платформу), що грають як звичайні композиції. Не залежить від перемикачів планет вище.

[string-mod-setting]
sa-music-placement-nauvis=Лише Наувіс
sa-music-placement-all-surfaces=Усі поверхні

[sa-music]
no-music=(немає музики)
variable=(змінена)
previous=Попередня композиція
next=Наступна композиція
shuffle-on=Перемішування: увімк. (гра обирає композиції випадково). Клацніть, щоб грати за порядком альбому.
shuffle-off=Перемішування: вимк. (композиції грають за порядком альбому). Клацніть, щоб перемішати.
