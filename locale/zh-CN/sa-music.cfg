[mod-description]
sa-music-on-nauvis=在禁用 Space Age 模组的游戏中播放 Space Age 原声音乐。音乐从你自己安装的 Space Age 中复制。

[mod-setting-name]
sa-music-shuffle=随机播放音乐
sa-music-show-controls=显示音乐控制
sa-music-show-title=显示曲目名称
sa-music-placement=音乐播放位置
sa-music-vulcanus=祝融星音乐
sa-music-fulgora=雷神星音乐
sa-music-gleba=句芒星音乐
sa-music-aquilo=玄冥星音乐
sa-music-space=太空平台音乐
sa-music-hero=英雄曲目

[mod-setting-description]
sa-music-shuffle=开：游戏随机选择下一首曲目。关：按专辑顺序播放。与随机播放按钮相同。
sa-music-show-controls=左上角的上一首、下一首、随机、停止和静音音乐按钮。
sa-music-show-title=在按钮旁显示正在播放的曲目名称。
sa-music-placement=仅新地星，或所有地表（适用于添加自有地表的模组，如 Space Exploration）。
sa-music-vulcanus=将祝融星的曲目加入播放列表。
sa-music-fulgora=将雷神星的曲目加入播放列表。
sa-music-gleba=将句芒星的曲目加入播放列表。
sa-music-aquilo=将玄冥星的曲目加入播放列表。
sa-music-space=将太空平台的曲目加入播放列表。
sa-music-hero=五首抵达主题曲（每个星球一首，太空平台一首），作为普通曲目播放。与上方的星球开关无关。

[string-mod-setting]
sa-music-placement-nauvis=仅新地星
sa-music-placement-all-surfaces=所有地表

[sa-music]
no-music=（无音乐）
variable=（可变）
previous=上一首
next=下一首
shuffle-on=随机播放：开（游戏随机选择曲目）。点击以按专辑顺序播放。
shuffle-off=随机播放：关（按专辑顺序播放）。点击以随机播放。
stop=停止音乐。按播放可再次收听此曲目。
play=从头重新播放已停止的曲目。
stopped=（已停止）
mute-off=静音音乐。再次点击或按上一首、下一首之前不会播放音乐。
mute-on=音乐已静音。点击以重新播放音乐。
muted=（音乐已静音）
toggle=音乐播放器。点击以显示或隐藏。
