[mod-description]
sa-music-on-nauvis=Luan muzikën e Space Age në lojërat ku modi Space Age është i çaktivizuar. Muzika kopjohet nga instalimi yt i Space Age.

[mod-setting-name]
sa-music-shuffle=Muzikë e rastësishme
sa-music-show-controls=Shfaq kontrollet e muzikës
sa-music-show-title=Shfaq emrin e këngës
sa-music-placement=Ku të luhet muzika
sa-music-vulcanus=Muzika e Vulcanus
sa-music-fulgora=Muzika e Fulgora
sa-music-gleba=Muzika e Gleba
sa-music-aquilo=Muzika e Aquilo
sa-music-space=Muzika e platformave hapësinore
sa-music-hero=Këngë heroike

[mod-setting-description]
sa-music-shuffle=Aktiv: loja zgjedh këngën tjetër rastësisht. Joaktiv: këngët luhen sipas radhës së albumit. Njësoj si butoni i përzierjes.
sa-music-show-controls=Butonat E mëparshmja, Tjetra, Përziej, Ndalo dhe Hiq zërin e muzikës në këndin e sipërm majtas.
sa-music-show-title=Emri i këngës që po luhet, pranë butonave.
sa-music-placement=Vetëm Nauvis ose të gjitha sipërfaqet (e dobishme me mode që shtojnë sipërfaqet e tyre, si Space Exploration).
sa-music-vulcanus=Shto këngët e Vulcanus në listën e luajtjes.
sa-music-fulgora=Shto këngët e Fulgora në listën e luajtjes.
sa-music-gleba=Shto këngët e Gleba në listën e luajtjes.
sa-music-aquilo=Shto këngët e Aquilo në listën e luajtjes.
sa-music-space=Shto këngët e platformave hapësinore në listën e luajtjes.
sa-music-hero=Pesë temat e mbërritjes (një për çdo planet dhe një për platformën hapësinore), të luajtura si këngë të zakonshme. E pavarur nga çelësat e planetëve më sipër.

[string-mod-setting]
sa-music-placement-nauvis=Vetëm Nauvis
sa-music-placement-all-surfaces=Të gjitha sipërfaqet

[sa-music]
no-music=(pa muzikë)
variable=(e ndryshueshme)
previous=Kënga e mëparshme
next=Kënga tjetër
shuffle-on=Përzierje: aktive (loja zgjedh këngët rastësisht). Kliko për të luajtur sipas radhës së albumit.
shuffle-off=Përzierje: joaktive (këngët luhen sipas radhës së albumit). Kliko për të përzier.
stop=Ndalo muzikën. Shtyp Luaj për ta dëgjuar sërish këtë këngë.
play=Luaj sërish këngën e ndalur nga fillimi.
stopped=(e ndalur)
mute-off=Hiq zërin e muzikës. Nuk luhet muzikë derisa të klikosh sërish ose të shtypësh E mëparshmja ose Tjetra.
mute-on=Muzika është pa zë. Kliko për të luajtur sërish muzikë.
muted=(muzika pa zë)
toggle=Luajtësi i muzikës. Kliko për ta shfaqur ose fshehur.
