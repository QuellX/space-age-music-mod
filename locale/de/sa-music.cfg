[mod-description]
sa-music-on-nauvis=Spielt den Soundtrack von Space Age in Spielen, in denen die Mod Space Age deaktiviert ist. Die Musik wird aus deiner eigenen Space-Age-Installation kopiert.

[mod-setting-name]
sa-music-shuffle=Musik zufällig abspielen
sa-music-show-controls=Musiksteuerung anzeigen
sa-music-show-title=Titelnamen anzeigen
sa-music-placement=Wo die Musik gespielt wird
sa-music-vulcanus=Musik von Vulcanus
sa-music-fulgora=Musik von Fulgora
sa-music-gleba=Musik von Gleba
sa-music-aquilo=Musik von Aquilo
sa-music-space=Musik der Raumplattformen
sa-music-hero=Heldentitel

[mod-setting-description]
sa-music-shuffle=An: Das Spiel wählt den nächsten Titel zufällig. Aus: Die Titel laufen in Albumreihenfolge. Wie die Zufallswiedergabe-Schaltfläche.
sa-music-show-controls=Schaltflächen für Zurück, Weiter, Zufallswiedergabe, Stopp und Musik stummschalten oben links.
sa-music-show-title=Name des laufenden Titels neben den Schaltflächen.
sa-music-placement=Nur Nauvis oder alle Oberflächen (nützlich mit Mods, die eigene Oberflächen hinzufügen, z. B. Space Exploration).
sa-music-vulcanus=Die Titel von Vulcanus zur Wiedergabeliste hinzufügen.
sa-music-fulgora=Die Titel von Fulgora zur Wiedergabeliste hinzufügen.
sa-music-gleba=Die Titel von Gleba zur Wiedergabeliste hinzufügen.
sa-music-aquilo=Die Titel von Aquilo zur Wiedergabeliste hinzufügen.
sa-music-space=Die Titel der Raumplattformen zur Wiedergabeliste hinzufügen.
sa-music-hero=Die fünf Ankunftsthemen (eines pro Planet und eines für die Raumplattform), als normale Titel gespielt. Unabhängig von den Planetenschaltern oben.

[string-mod-setting]
sa-music-placement-nauvis=Nur Nauvis
sa-music-placement-all-surfaces=Alle Oberflächen

[sa-music]
no-music=(keine Musik)
variable=(variabel)
previous=Vorheriger Titel
next=Nächster Titel
shuffle-on=Zufallswiedergabe: an (das Spiel wählt Titel zufällig). Klicken, um in Albumreihenfolge zu spielen.
shuffle-off=Zufallswiedergabe: aus (Titel laufen in Albumreihenfolge). Klicken für Zufallswiedergabe.
stop=Musik stoppen. Drücke Abspielen, um diesen Titel erneut zu hören.
play=Den gestoppten Titel erneut von Anfang an abspielen.
stopped=(gestoppt)
mute-off=Musik stummschalten. Es läuft keine Musik, bis du erneut klickst oder Zurück bzw. Weiter drückst.
mute-on=Musik ist stummgeschaltet. Klicken, um wieder Musik zu spielen.
muted=(Musik stumm)
toggle=Musikplayer. Klicken, um ihn ein- oder auszublenden.
