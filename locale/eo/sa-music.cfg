[mod-description]
sa-music-on-nauvis=Ludas la muzikon de Space Age en ludoj, kie la modifaĵo Space Age estas malŝaltita. La muziko estas kopiita el via propra instalaĵo de Space Age.

[mod-setting-name]
sa-music-shuffle=Hazarda muziko
sa-music-show-controls=Montri muzikregilojn
sa-music-show-title=Montri nomon de la peco
sa-music-placement=Kie ludi la muzikon
sa-music-vulcanus=Muziko de Vulkano
sa-music-fulgora=Muziko de Fulgoro
sa-music-gleba=Muziko de Glebo
sa-music-aquilo=Muziko de Akvilo
sa-music-space=Muziko de kosmoplatformoj
sa-music-hero=Heroaj pecoj

[mod-setting-description]
sa-music-shuffle=Ŝaltita: la ludo elektas la sekvan pecon hazarde. Malŝaltita: la pecoj ludiĝas laŭ la albuma ordo. Same kiel la miksa butono.
sa-music-show-controls=Butonoj Antaŭa, Sekva, Miksi, Haltigi kaj Silentigi muzikon en la supra maldekstra angulo.
sa-music-show-title=Nomo de la ludata peco, apud la butonoj.
sa-music-placement=Nur Nauvis, aŭ ĉiuj surfacoj (utila kun modifaĵoj, kiuj aldonas proprajn surfacojn, ekz. Space Exploration).
sa-music-vulcanus=Aldoni la pecojn de Vulkano al la ludlisto.
sa-music-fulgora=Aldoni la pecojn de Fulgoro al la ludlisto.
sa-music-gleba=Aldoni la pecojn de Glebo al la ludlisto.
sa-music-aquilo=Aldoni la pecojn de Akvilo al la ludlisto.
sa-music-space=Aldoni la pecojn de la kosmoplatformoj al la ludlisto.
sa-music-hero=La kvin alvenaj temoj (po unu por ĉiu planedo kaj unu por la kosmoplatformo), ludataj kiel ordinaraj pecoj. Sendepende de la planedaj ŝaltiloj supre.

[string-mod-setting]
sa-music-placement-nauvis=Nur Nauvis
sa-music-placement-all-surfaces=Ĉiuj surfacoj

[sa-music]
no-music=(neniu muziko)
variable=(varia)
previous=Antaŭa peco
next=Sekva peco
shuffle-on=Miksado: ŝaltita (la ludo elektas pecojn hazarde). Alklaku por ludi laŭ la albuma ordo.
shuffle-off=Miksado: malŝaltita (la pecoj ludiĝas laŭ la albuma ordo). Alklaku por miksi.
stop=Haltigi la muzikon. Premu Ludi por denove aŭdi ĉi tiun pecon.
play=Denove ludi la haltigitan pecon de la komenco.
stopped=(haltigita)
mute-off=Silentigi la muzikon. Neniu muziko ludas ĝis vi denove alklakos aŭ premos Antaŭa aŭ Sekva.
mute-on=La muziko estas silentigita. Alklaku por denove ludi muzikon.
muted=(muziko silentigita)
toggle=Muzikludilo. Alklaku por montri aŭ kaŝi ĝin.
