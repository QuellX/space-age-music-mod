[mod-description]
sa-music-on-nauvis=Soittaa Space Agen ääniraitaa peleissä, joissa Space Age -modi on poissa käytöstä. Musiikki kopioidaan omasta Space Age -asennuksestasi.

[mod-setting-name]
sa-music-shuffle=Satunnainen musiikki
sa-music-show-controls=Näytä musiikin säätimet
sa-music-show-title=Näytä kappaleen nimi
sa-music-placement=Missä musiikki soi
sa-music-vulcanus=Vulcanuksen musiikki
sa-music-fulgora=Fulgoran musiikki
sa-music-gleba=Gleban musiikki
sa-music-aquilo=Aquilon musiikki
sa-music-space=Avaruusalustojen musiikki
sa-music-hero=Sankarikappaleet

[mod-setting-description]
sa-music-shuffle=Päällä: peli valitsee seuraavan kappaleen satunnaisesti. Pois: kappaleet soivat albumin järjestyksessä. Sama kuin satunnaistoistopainike.
sa-music-show-controls=Edellinen-, Seuraava-, Satunnainen-, Pysäytä- ja Mykistä musiikki -painikkeet vasemmassa yläkulmassa.
sa-music-show-title=Soivan kappaleen nimi painikkeiden vieressä.
sa-music-placement=Vain Nauvis tai kaikki pinnat (hyödyllinen modien kanssa, jotka lisäävät omia pintoja, kuten Space Exploration).
sa-music-vulcanus=Lisää Vulcanuksen kappaleet soittolistaan.
sa-music-fulgora=Lisää Fulgoran kappaleet soittolistaan.
sa-music-gleba=Lisää Gleban kappaleet soittolistaan.
sa-music-aquilo=Lisää Aquilon kappaleet soittolistaan.
sa-music-space=Lisää avaruusalustojen kappaleet soittolistaan.
sa-music-hero=Viisi saapumisteemaa (yksi kullekin planeetalle ja yksi avaruusalustalle) tavallisina kappaleina. Riippumaton yllä olevista planeettakytkimistä.

[string-mod-setting]
sa-music-placement-nauvis=Vain Nauvis
sa-music-placement-all-surfaces=Kaikki pinnat

[sa-music]
no-music=(ei musiikkia)
variable=(vaihteleva)
previous=Edellinen kappale
next=Seuraava kappale
shuffle-on=Satunnaistoisto: päällä (peli valitsee kappaleet satunnaisesti). Napsauta soittaaksesi albumin järjestyksessä.
shuffle-off=Satunnaistoisto: pois (kappaleet soivat albumin järjestyksessä). Napsauta sekoittaaksesi.
stop=Pysäytä musiikki. Paina Toista kuullaksesi tämän kappaleen uudelleen.
play=Toista pysäytetty kappale uudelleen alusta.
stopped=(pysäytetty)
mute-off=Mykistä musiikki. Musiikkia ei soiteta ennen kuin napsautat uudelleen tai painat Edellinen tai Seuraava.
mute-on=Musiikki on mykistetty. Napsauta soittaaksesi musiikkia taas.
muted=(musiikki mykistetty)
toggle=Musiikkisoitin. Napsauta näyttääksesi tai piilottaaksesi sen.
