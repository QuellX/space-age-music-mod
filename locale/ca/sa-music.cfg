[mod-description]
sa-music-on-nauvis=Reprodueix la banda sonora de Space Age en partides on el mod Space Age està desactivat. La música es copia de la teva pròpia instal·lació de Space Age.

[mod-setting-name]
sa-music-shuffle=Reproducció aleatòria
sa-music-show-controls=Mostra els controls de música
sa-music-show-title=Mostra el nom de la pista
sa-music-placement=On reproduir la música
sa-music-vulcanus=Música de Vulcà
sa-music-fulgora=Música de Fulgora
sa-music-gleba=Música de Gleba
sa-music-aquilo=Música d'Aquiló
sa-music-space=Música de les plataformes espacials
sa-music-hero=Pistes heroiques

[mod-setting-description]
sa-music-shuffle=Activat: el joc tria la pista següent a l'atzar. Desactivat: les pistes sonen en l'ordre de l'àlbum. Igual que el botó d'aleatori.
sa-music-show-controls=Botons Anterior, Següent, Aleatori, Atura i Silencia la música a la cantonada superior esquerra.
sa-music-show-title=Nom de la pista que sona, al costat dels botons.
sa-music-placement=Només Nauvis, o totes les superfícies (útil amb mods que afegeixen superfícies pròpies, com Space Exploration).
sa-music-vulcanus=Afegeix les pistes de Vulcà a la llista de reproducció.
sa-music-fulgora=Afegeix les pistes de Fulgora a la llista de reproducció.
sa-music-gleba=Afegeix les pistes de Gleba a la llista de reproducció.
sa-music-aquilo=Afegeix les pistes d'Aquiló a la llista de reproducció.
sa-music-space=Afegeix les pistes de les plataformes espacials a la llista de reproducció.
sa-music-hero=Els cinc temes d'arribada (un per planeta i un per a la plataforma espacial), reproduïts com a pistes normals. Independent dels interruptors de planetes de dalt.

[string-mod-setting]
sa-music-placement-nauvis=Només Nauvis
sa-music-placement-all-surfaces=Totes les superfícies

[sa-music]
no-music=(sense música)
variable=(variable)
previous=Pista anterior
next=Pista següent
shuffle-on=Aleatori: activat (el joc tria les pistes a l'atzar). Fes clic per reproduir en l'ordre de l'àlbum.
shuffle-off=Aleatori: desactivat (les pistes sonen en l'ordre de l'àlbum). Fes clic per barrejar.
stop=Atura la música. Prem Reprodueix per tornar a escoltar aquesta pista.
play=Torna a reproduir la pista aturada des del principi.
stopped=(aturada)
mute-off=Silencia la música. No sonarà música fins que tornis a fer clic o premis Anterior o Següent.
mute-on=La música està silenciada. Fes clic per tornar-la a reproduir.
muted=(música silenciada)
toggle=Reproductor de música. Fes clic per mostrar-lo o amagar-lo.
