[mod-description]
sa-music-on-nauvis=Riproduce la colonna sonora di Space Age nelle partite in cui la mod Space Age è disattivata. La musica viene copiata dalla tua installazione di Space Age.

[mod-setting-name]
sa-music-shuffle=Riproduzione casuale
sa-music-show-controls=Mostra i comandi della musica
sa-music-show-title=Mostra il nome del brano
sa-music-placement=Dove riprodurre la musica
sa-music-vulcanus=Musica di Vulcanus
sa-music-fulgora=Musica di Fulgora
sa-music-gleba=Musica di Gleba
sa-music-aquilo=Musica di Aquilo
sa-music-space=Musica delle piattaforme spaziali
sa-music-hero=Brani eroici

[mod-setting-description]
sa-music-shuffle=Attivo: il gioco sceglie il brano successivo a caso. Disattivo: i brani seguono l'ordine dell'album. Come il pulsante di riproduzione casuale.
sa-music-show-controls=Pulsanti Precedente, Successivo, Casuale, Stop e Silenzia musica nell'angolo in alto a sinistra.
sa-music-show-title=Nome del brano in riproduzione, accanto ai pulsanti.
sa-music-placement=Solo Nauvis o tutte le superfici (utile con le mod che aggiungono superfici proprie, come Space Exploration).
sa-music-vulcanus=Aggiunge i brani di Vulcanus alla playlist.
sa-music-fulgora=Aggiunge i brani di Fulgora alla playlist.
sa-music-gleba=Aggiunge i brani di Gleba alla playlist.
sa-music-aquilo=Aggiunge i brani di Aquilo alla playlist.
sa-music-space=Aggiunge i brani delle piattaforme spaziali alla playlist.
sa-music-hero=I cinque temi di arrivo (uno per pianeta e uno per la piattaforma spaziale), riprodotti come brani normali. Indipendente dagli interruttori dei pianeti sopra.

[string-mod-setting]
sa-music-placement-nauvis=Solo Nauvis
sa-music-placement-all-surfaces=Tutte le superfici

[sa-music]
no-music=(nessuna musica)
variable=(variabile)
previous=Brano precedente
next=Brano successivo
shuffle-on=Casuale: attivo (il gioco sceglie i brani a caso). Clicca per riprodurre in ordine di album.
shuffle-off=Casuale: disattivo (i brani seguono l'ordine dell'album). Clicca per mescolare.
stop=Ferma la musica. Premi Riproduci per riascoltare questo brano.
play=Riproduce di nuovo il brano fermato dall'inizio.
stopped=(fermato)
mute-off=Silenzia la musica. Nessuna musica finché non clicchi di nuovo o premi Precedente o Successivo.
mute-on=La musica è silenziata. Clicca per riattivarla.
muted=(musica silenziata)
toggle=Lettore musicale. Clicca per mostrarlo o nasconderlo.
