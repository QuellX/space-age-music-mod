[mod-description]
sa-music-on-nauvis=Прайгравае саўндтрэк Space Age у гульнях, дзе мод Space Age адключаны. Музыка капіюецца з вашай уласнай усталёўкі Space Age.

[mod-setting-name]
sa-music-shuffle=Перамешваць музыку
sa-music-show-controls=Паказваць кіраванне музыкай
sa-music-show-title=Паказваць назву кампазіцыі
sa-music-placement=Дзе прайграваць музыку
sa-music-vulcanus=Музыка Вулкана
sa-music-fulgora=Музыка Фульгоры
sa-music-gleba=Музыка Глебы
sa-music-aquilo=Музыка Аквілона
sa-music-space=Музыка касмічных платформ
sa-music-hero=Гераічныя кампазіцыі

[mod-setting-description]
sa-music-shuffle=Укл.: гульня выбірае наступную кампазіцыю выпадкова. Выкл.: кампазіцыі граюць у парадку альбома. Тое ж, што кнопка перамешвання.
sa-music-show-controls=Кнопкі «Папярэдняя», «Наступная», «Перамяшаць», «Стоп» і «Выключыць музыку» ў левым верхнім куце.
sa-music-show-title=Назва кампазіцыі, што грае, побач з кнопкамі.
sa-music-placement=Толькі на Наўвісе або на ўсіх паверхнях (карысна з модамі, якія дадаюць свае паверхні, напрыклад Space Exploration).
sa-music-vulcanus=Дадаць кампазіцыі Вулкана ў спіс прайгравання.
sa-music-fulgora=Дадаць кампазіцыі Фульгоры ў спіс прайгравання.
sa-music-gleba=Дадаць кампазіцыі Глебы ў спіс прайгравання.
sa-music-aquilo=Дадаць кампазіцыі Аквілона ў спіс прайгравання.
sa-music-space=Дадаць кампазіцыі касмічных платформ у спіс прайгравання.
sa-music-hero=Пяць тэм прыбыцця (па адной на кожную планету і касмічную платформу), якія граюць як звычайныя кампазіцыі. Не залежыць ад пераключальнікаў планет вышэй.

[string-mod-setting]
sa-music-placement-nauvis=Толькі Наўвіс
sa-music-placement-all-surfaces=Усе паверхні

[sa-music]
no-music=(няма музыкі)
variable=(зменная)
previous=Папярэдняя кампазіцыя
next=Наступная кампазіцыя
shuffle-on=Перамешванне: укл. (гульня выбірае кампазіцыі выпадкова). Націсніце, каб граць у парадку альбома.
shuffle-off=Перамешванне: выкл. (кампазіцыі граюць у парадку альбома). Націсніце, каб перамяшаць.
stop=Спыніць музыку. Націсніце «Прайграць», каб зноў пачуць гэтую кампазіцыю.
play=Зноў прайграць спыненую кампазіцыю з пачатку.
stopped=(спынена)
mute-off=Выключыць музыку. Музыка не грае, пакуль вы не націснеце зноў або «Папярэдняя» ці «Наступная».
mute-on=Музыка выключана. Націсніце, каб зноў уключыць.
muted=(музыка выключана)
toggle=Музычны прайгравальнік. Націсніце, каб паказаць або схаваць яго.
