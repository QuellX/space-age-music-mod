[mod-description]
sa-music-on-nauvis=Пуска саундтрака на Space Age в игри, в които модът Space Age е изключен. Музиката се копира от вашата собствена инсталация на Space Age.

[mod-setting-name]
sa-music-shuffle=Разбъркана музика
sa-music-show-controls=Показване на контролите за музика
sa-music-show-title=Показване на името на песента
sa-music-placement=Къде да се пуска музиката
sa-music-vulcanus=Музика от Вулканус
sa-music-fulgora=Музика от Фулгора
sa-music-gleba=Музика от Глеба
sa-music-aquilo=Музика от Аквило
sa-music-space=Музика от космическите платформи
sa-music-hero=Геройски песни

[mod-setting-description]
sa-music-shuffle=Вкл.: играта избира следващата песен на случаен принцип. Изкл.: песните се пускат по реда на албума. Същото като бутона за разбъркване.
sa-music-show-controls=Бутони Предишна, Следваща, Разбъркай, Стоп и Заглуши музиката в горния ляв ъгъл.
sa-music-show-title=Името на звучащата песен до бутоните.
sa-music-placement=Само Наувис или всички повърхности (полезно с модове, които добавят свои повърхности, например Space Exploration).
sa-music-vulcanus=Добавяне на песните от Вулканус към списъка.
sa-music-fulgora=Добавяне на песните от Фулгора към списъка.
sa-music-gleba=Добавяне на песните от Глеба към списъка.
sa-music-aquilo=Добавяне на песните от Аквило към списъка.
sa-music-space=Добавяне на песните от космическите платформи към списъка.
sa-music-hero=Петте теми на пристигане (по една за всяка планета и една за космическата платформа), пускани като обикновени песни. Независимо от превключвателите на планетите по-горе.

[string-mod-setting]
sa-music-placement-nauvis=Само Наувис
sa-music-placement-all-surfaces=Всички повърхности

[sa-music]
no-music=(няма музика)
variable=(променлива)
previous=Предишна песен
next=Следваща песен
shuffle-on=Разбъркване: вкл. (играта избира песни на случаен принцип). Щракнете, за да се пускат по реда на албума.
shuffle-off=Разбъркване: изкл. (песните се пускат по реда на албума). Щракнете, за да разбъркате.
stop=Спиране на музиката. Натиснете Пусни, за да чуете тази песен отново.
play=Пускане на спряната песен отново от началото.
stopped=(спряна)
mute-off=Заглушаване на музиката. Няма музика, докато не щракнете отново или не натиснете Предишна или Следваща.
mute-on=Музиката е заглушена. Щракнете, за да я пуснете отново.
muted=(музиката е заглушена)
toggle=Музикален плейър. Щракнете, за да го покажете или скриете.
