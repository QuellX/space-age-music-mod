[mod-description]
sa-music-on-nauvis=Space Age 모드가 비활성화된 게임에서 Space Age 사운드트랙을 재생합니다. 음악은 사용자의 Space Age 설치본에서 복사됩니다.

[mod-setting-name]
sa-music-shuffle=음악 무작위 재생
sa-music-show-controls=음악 컨트롤 표시
sa-music-show-title=곡 이름 표시
sa-music-placement=음악을 재생할 곳
sa-music-vulcanus=불카누스 음악
sa-music-fulgora=풀고라 음악
sa-music-gleba=글레바 음악
sa-music-aquilo=아퀼로 음악
sa-music-space=우주 플랫폼 음악
sa-music-hero=영웅 곡

[mod-setting-description]
sa-music-shuffle=켜기: 게임이 다음 곡을 무작위로 고릅니다. 끄기: 앨범 순서대로 재생합니다. 무작위 재생 버튼과 같습니다.
sa-music-show-controls=왼쪽 위에 이전, 다음, 무작위, 정지, 음악 음소거 버튼을 표시합니다.
sa-music-show-title=재생 중인 곡 이름을 버튼 옆에 표시합니다.
sa-music-placement=나우비스만, 또는 모든 지표면 (Space Exploration처럼 자체 지표면을 추가하는 모드와 함께 쓸 때 유용합니다).
sa-music-vulcanus=불카누스 곡을 재생 목록에 추가합니다.
sa-music-fulgora=풀고라 곡을 재생 목록에 추가합니다.
sa-music-gleba=글레바 곡을 재생 목록에 추가합니다.
sa-music-aquilo=아퀼로 곡을 재생 목록에 추가합니다.
sa-music-space=우주 플랫폼 곡을 재생 목록에 추가합니다.
sa-music-hero=다섯 개의 도착 테마 (행성마다 하나, 우주 플랫폼에 하나)를 일반 곡으로 재생합니다. 위의 행성 스위치와 별개입니다.

[string-mod-setting]
sa-music-placement-nauvis=나우비스만
sa-music-placement-all-surfaces=모든 지표면

[sa-music]
no-music=(음악 없음)
variable=(가변)
previous=이전 곡
next=다음 곡
shuffle-on=무작위: 켜짐 (게임이 곡을 무작위로 고릅니다). 클릭하면 앨범 순서대로 재생합니다.
shuffle-off=무작위: 꺼짐 (앨범 순서대로 재생합니다). 클릭하면 섞습니다.
stop=음악을 정지합니다. 재생을 누르면 이 곡을 다시 들을 수 있습니다.
play=정지한 곡을 처음부터 다시 재생합니다.
stopped=(정지됨)
mute-off=음악을 음소거합니다. 다시 클릭하거나 이전 또는 다음을 누를 때까지 음악이 나오지 않습니다.
mute-on=음악이 음소거되었습니다. 클릭하면 다시 재생합니다.
muted=(음악 음소거됨)
toggle=음악 플레이어. 클릭하여 표시하거나 숨깁니다.
