[mod-description]
sa-music-on-nauvis=Reproducira glazbu Space Age u igrama u kojima je mod Space Age onemogućen. Glazba se kopira iz tvoje vlastite instalacije Space Age.

[mod-setting-name]
sa-music-shuffle=Nasumična glazba
sa-music-show-controls=Prikaži upravljanje glazbom
sa-music-show-title=Prikaži naziv pjesme
sa-music-placement=Gdje svirati glazbu
sa-music-vulcanus=Glazba Vulcanusa
sa-music-fulgora=Glazba Fulgore
sa-music-gleba=Glazba Glebe
sa-music-aquilo=Glazba Aquila
sa-music-space=Glazba svemirskih platformi
sa-music-hero=Herojske pjesme

[mod-setting-description]
sa-music-shuffle=Uključeno: igra nasumično bira sljedeću pjesmu. Isključeno: pjesme sviraju redoslijedom albuma. Isto kao gumb za nasumičnu reprodukciju.
sa-music-show-controls=Gumbi Prethodna, Sljedeća, Nasumično, Zaustavi i Utišaj glazbu u gornjem lijevom kutu.
sa-music-show-title=Naziv pjesme koja svira, pokraj gumba.
sa-music-placement=Samo Nauvis ili sve površine (korisno s modovima koji dodaju vlastite površine, poput Space Exploration).
sa-music-vulcanus=Dodaj pjesme Vulcanusa na popis za reprodukciju.
sa-music-fulgora=Dodaj pjesme Fulgore na popis za reprodukciju.
sa-music-gleba=Dodaj pjesme Glebe na popis za reprodukciju.
sa-music-aquilo=Dodaj pjesme Aquila na popis za reprodukciju.
sa-music-space=Dodaj pjesme svemirskih platformi na popis za reprodukciju.
sa-music-hero=Pet tema dolaska (jedna za svaki planet i jedna za svemirsku platformu), sviranih kao obične pjesme. Neovisno o prekidačima planeta iznad.

[string-mod-setting]
sa-music-placement-nauvis=Samo Nauvis
sa-music-placement-all-surfaces=Sve površine

[sa-music]
no-music=(nema glazbe)
variable=(promjenjiva)
previous=Prethodna pjesma
next=Sljedeća pjesma
shuffle-on=Nasumično: uključeno (igra nasumično bira pjesme). Klikni za reprodukciju redoslijedom albuma.
shuffle-off=Nasumično: isključeno (pjesme sviraju redoslijedom albuma). Klikni za miješanje.
stop=Zaustavi glazbu. Pritisni Reproduciraj da ponovno čuješ ovu pjesmu.
play=Ponovno reproduciraj zaustavljenu pjesmu od početka.
stopped=(zaustavljeno)
mute-off=Utišaj glazbu. Glazba ne svira dok ponovno ne klikneš ili pritisneš Prethodna ili Sljedeća.
mute-on=Glazba je utišana. Klikni da glazba ponovno svira.
muted=(glazba utišana)
toggle=Glazbeni player. Klikni da ga prikažeš ili sakriješ.
