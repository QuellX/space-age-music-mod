[mod-description]
sa-music-on-nauvis=Afspiller Space Age-soundtracket i spil, hvor Space Age-modden er slået fra. Musikken kopieres fra din egen Space Age-installation.

[mod-setting-name]
sa-music-shuffle=Bland musik
sa-music-show-controls=Vis musikkontroller
sa-music-show-title=Vis nummerets navn
sa-music-placement=Hvor musikken afspilles
sa-music-vulcanus=Musik fra Vulcanus
sa-music-fulgora=Musik fra Fulgora
sa-music-gleba=Musik fra Gleba
sa-music-aquilo=Musik fra Aquilo
sa-music-space=Musik fra rumplatforme
sa-music-hero=Heltenumre

[mod-setting-description]
sa-music-shuffle=Til: spillet vælger det næste nummer tilfældigt. Fra: numrene spilles i albumrækkefølge. Samme som bland-knappen.
sa-music-show-controls=Knapperne Forrige, Næste, Bland, Stop og Slå musik fra i øverste venstre hjørne.
sa-music-show-title=Navnet på det nummer, der spiller, ved siden af knapperne.
sa-music-placement=Kun Nauvis, eller alle overflader (nyttigt med mods, der tilføjer egne overflader, som Space Exploration).
sa-music-vulcanus=Tilføj numrene fra Vulcanus til spillelisten.
sa-music-fulgora=Tilføj numrene fra Fulgora til spillelisten.
sa-music-gleba=Tilføj numrene fra Gleba til spillelisten.
sa-music-aquilo=Tilføj numrene fra Aquilo til spillelisten.
sa-music-space=Tilføj numrene fra rumplatformene til spillelisten.
sa-music-hero=De fem ankomsttemaer (ét pr. planet og ét for rumplatformen), spillet som almindelige numre. Uafhængigt af planetkontakterne ovenfor.

[string-mod-setting]
sa-music-placement-nauvis=Kun Nauvis
sa-music-placement-all-surfaces=Alle overflader

[sa-music]
no-music=(ingen musik)
variable=(variabel)
previous=Forrige nummer
next=Næste nummer
shuffle-on=Bland: til (spillet vælger numre tilfældigt). Klik for at spille i albumrækkefølge.
shuffle-off=Bland: fra (numrene spilles i albumrækkefølge). Klik for at blande.
stop=Stop musikken. Tryk på Afspil for at høre dette nummer igen.
play=Afspil det stoppede nummer igen fra begyndelsen.
stopped=(stoppet)
mute-off=Slå musik fra. Der spilles ingen musik, før du klikker igen eller trykker på Forrige eller Næste.
mute-on=Musikken er slået fra. Klik for at spille musik igen.
muted=(musik slået fra)
toggle=Musikafspiller. Klik for at vise eller skjule den.
