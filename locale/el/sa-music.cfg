[mod-description]
sa-music-on-nauvis=Παίζει το soundtrack του Space Age σε παιχνίδια όπου το mod Space Age είναι απενεργοποιημένο. Η μουσική αντιγράφεται από τη δική σου εγκατάσταση του Space Age.

[mod-setting-name]
sa-music-shuffle=Τυχαία μουσική
sa-music-show-controls=Εμφάνιση χειριστηρίων μουσικής
sa-music-show-title=Εμφάνιση ονόματος κομματιού
sa-music-placement=Πού παίζει η μουσική
sa-music-vulcanus=Μουσική του Βόλκανους
sa-music-fulgora=Μουσική της Φόλγκορα
sa-music-gleba=Μουσική της Γκλίμπα
sa-music-aquilo=Μουσική του Ακουίλο
sa-music-space=Μουσική των διαστημικών πλατφορμών
sa-music-hero=Ηρωικά κομμάτια

[mod-setting-description]
sa-music-shuffle=Ενεργό: το παιχνίδι επιλέγει το επόμενο κομμάτι τυχαία. Ανενεργό: τα κομμάτια παίζουν με τη σειρά του άλμπουμ. Ίδιο με το κουμπί τυχαίας αναπαραγωγής.
sa-music-show-controls=Κουμπιά Προηγούμενο, Επόμενο, Τυχαία, Διακοπή και Σίγαση μουσικής πάνω αριστερά.
sa-music-show-title=Όνομα του κομματιού που παίζει, δίπλα στα κουμπιά.
sa-music-placement=Μόνο Nauvis ή όλες οι επιφάνειες (χρήσιμο με mods που προσθέτουν δικές τους επιφάνειες, όπως το Space Exploration).
sa-music-vulcanus=Προσθήκη των κομματιών του Βόλκανους στη λίστα αναπαραγωγής.
sa-music-fulgora=Προσθήκη των κομματιών της Φόλγκορα στη λίστα αναπαραγωγής.
sa-music-gleba=Προσθήκη των κομματιών της Γκλίμπα στη λίστα αναπαραγωγής.
sa-music-aquilo=Προσθήκη των κομματιών του Ακουίλο στη λίστα αναπαραγωγής.
sa-music-space=Προσθήκη των κομματιών των διαστημικών πλατφορμών στη λίστα αναπαραγωγής.
sa-music-hero=Τα πέντε θέματα άφιξης (ένα για κάθε πλανήτη και ένα για τη διαστημική πλατφόρμα), ως κανονικά κομμάτια. Ανεξάρτητο από τους διακόπτες πλανητών παραπάνω.

[string-mod-setting]
sa-music-placement-nauvis=Μόνο Nauvis
sa-music-placement-all-surfaces=Όλες οι επιφάνειες

[sa-music]
no-music=(χωρίς μουσική)
variable=(μεταβλητό)
previous=Προηγούμενο κομμάτι
next=Επόμενο κομμάτι
shuffle-on=Τυχαία: ενεργό (το παιχνίδι επιλέγει κομμάτια τυχαία). Κάνε κλικ για αναπαραγωγή με τη σειρά του άλμπουμ.
shuffle-off=Τυχαία: ανενεργό (τα κομμάτια παίζουν με τη σειρά του άλμπουμ). Κάνε κλικ για ανακάτεμα.
stop=Διακοπή μουσικής. Πάτα Αναπαραγωγή για να ξανακούσεις αυτό το κομμάτι.
play=Αναπαραγωγή του σταματημένου κομματιού ξανά από την αρχή.
stopped=(σταματημένο)
mute-off=Σίγαση μουσικής. Δεν παίζει μουσική μέχρι να κάνεις ξανά κλικ ή να πατήσεις Προηγούμενο ή Επόμενο.
mute-on=Η μουσική είναι σε σίγαση. Κάνε κλικ για να ξαναπαίξει μουσική.
muted=(μουσική σε σίγαση)
toggle=Πρόγραμμα αναπαραγωγής μουσικής. Κάνε κλικ για εμφάνιση ή απόκρυψη.
