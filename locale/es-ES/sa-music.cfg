[mod-description]
sa-music-on-nauvis=Reproduce la banda sonora de Space Age en partidas en las que el mod Space Age está desactivado. La música se copia de tu propia instalación de Space Age.

[mod-setting-name]
sa-music-shuffle=Reproducción aleatoria
sa-music-show-controls=Mostrar controles de música
sa-music-show-title=Mostrar nombre de la pista
sa-music-placement=Dónde reproducir la música
sa-music-vulcanus=Música de Vulcano
sa-music-fulgora=Música de Fulgora
sa-music-gleba=Música de Gleba
sa-music-aquilo=Música de Aquilo
sa-music-space=Música de las plataformas espaciales
sa-music-hero=Pistas heroicas

[mod-setting-description]
sa-music-shuffle=Activado: el juego elige la siguiente pista al azar. Desactivado: las pistas suenan en el orden del álbum. Igual que el botón de reproducción aleatoria.
sa-music-show-controls=Botones Anterior, Siguiente, Aleatorio, Detener y Silenciar música en la esquina superior izquierda.
sa-music-show-title=Nombre de la pista que suena, junto a los botones.
sa-music-placement=Solo Nauvis, o todas las superficies (útil con mods que añaden sus propias superficies, como Space Exploration).
sa-music-vulcanus=Añadir las pistas de Vulcano a la lista de reproducción.
sa-music-fulgora=Añadir las pistas de Fulgora a la lista de reproducción.
sa-music-gleba=Añadir las pistas de Gleba a la lista de reproducción.
sa-music-aquilo=Añadir las pistas de Aquilo a la lista de reproducción.
sa-music-space=Añadir las pistas de las plataformas espaciales a la lista de reproducción.
sa-music-hero=Los cinco temas de llegada (uno por planeta y uno para la plataforma espacial), reproducidos como pistas normales. Independiente de los interruptores de planetas de arriba.

[string-mod-setting]
sa-music-placement-nauvis=Solo Nauvis
sa-music-placement-all-surfaces=Todas las superficies

[sa-music]
no-music=(sin música)
variable=(variable)
previous=Pista anterior
next=Pista siguiente
shuffle-on=Aleatorio: activado (el juego elige las pistas al azar). Haz clic para reproducir en el orden del álbum.
shuffle-off=Aleatorio: desactivado (las pistas suenan en el orden del álbum). Haz clic para mezclar.
stop=Detener la música. Pulsa Reproducir para volver a escuchar esta pista.
play=Reproducir de nuevo la pista detenida desde el principio.
stopped=(detenida)
mute-off=Silenciar la música. No sonará música hasta que vuelvas a hacer clic o pulses Anterior o Siguiente.
mute-on=La música está silenciada. Haz clic para volver a reproducirla.
muted=(música silenciada)
toggle=Reproductor de música. Haz clic para mostrarlo u ocultarlo.
