[mod-description]
sa-music-on-nauvis=Prehráva soundtrack Space Age v hrách, kde je mód Space Age vypnutý. Hudba sa kopíruje z tvojej vlastnej inštalácie Space Age.

[mod-setting-name]
sa-music-shuffle=Náhodná hudba
sa-music-show-controls=Zobraziť ovládanie hudby
sa-music-show-title=Zobraziť názov skladby
sa-music-placement=Kde hrať hudbu
sa-music-vulcanus=Hudba z Vulcanu
sa-music-fulgora=Hudba z Fulgory
sa-music-gleba=Hudba z Gleby
sa-music-aquilo=Hudba z Aquila
sa-music-space=Hudba vesmírnych plošín
sa-music-hero=Hrdinské skladby

[mod-setting-description]
sa-music-shuffle=Zapnuté: hra vyberá ďalšiu skladbu náhodne. Vypnuté: skladby hrajú v poradí albumu. Rovnaké ako tlačidlo náhodného prehrávania.
sa-music-show-controls=Tlačidlá Predchádzajúca, Ďalšia, Náhodne, Zastaviť a Stlmiť hudbu v ľavom hornom rohu.
sa-music-show-title=Názov hrajúcej skladby vedľa tlačidiel.
sa-music-placement=Iba Nauvis, alebo všetky povrchy (užitočné s módmi, ktoré pridávajú vlastné povrchy, napr. Space Exploration).
sa-music-vulcanus=Pridať skladby z Vulcanu do zoznamu skladieb.
sa-music-fulgora=Pridať skladby z Fulgory do zoznamu skladieb.
sa-music-gleba=Pridať skladby z Gleby do zoznamu skladieb.
sa-music-aquilo=Pridať skladby z Aquila do zoznamu skladieb.
sa-music-space=Pridať skladby vesmírnych plošín do zoznamu skladieb.
sa-music-hero=Päť príletových tém (jedna pre každú planétu a jedna pre vesmírnu plošinu), hraných ako bežné skladby. Nezávislé od prepínačov planét vyššie.

[string-mod-setting]
sa-music-placement-nauvis=Iba Nauvis
sa-music-placement-all-surfaces=Všetky povrchy

[sa-music]
no-music=(žiadna hudba)
variable=(premenlivá)
previous=Predchádzajúca skladba
next=Ďalšia skladba
shuffle-on=Náhodne: zapnuté (hra vyberá skladby náhodne). Klikni pre prehrávanie v poradí albumu.
shuffle-off=Náhodne: vypnuté (skladby hrajú v poradí albumu). Klikni pre zamiešanie.
stop=Zastaviť hudbu. Stlač Prehrať a túto skladbu budeš počuť znova.
play=Prehrať zastavenú skladbu znova od začiatku.
stopped=(zastavené)
mute-off=Stlmiť hudbu. Hudba nehrá, kým znova neklikneš alebo nestlačíš Predchádzajúca či Ďalšia.
mute-on=Hudba je stlmená. Klikni a hudba bude znova hrať.
muted=(hudba stlmená)
toggle=Hudobný prehrávač. Klikni pre zobrazenie alebo skrytie.
