[mod-description]
sa-music-on-nauvis=Phát nhạc nền của Space Age trong các ván chơi đã tắt mod Space Age. Nhạc được sao chép từ bản cài đặt Space Age của chính bạn.

[mod-setting-name]
sa-music-shuffle=Phát nhạc ngẫu nhiên
sa-music-show-controls=Hiện điều khiển nhạc
sa-music-show-title=Hiện tên bài
sa-music-placement=Nơi phát nhạc
sa-music-vulcanus=Nhạc Vulcanus
sa-music-fulgora=Nhạc Fulgora
sa-music-gleba=Nhạc Gleba
sa-music-aquilo=Nhạc Aquilo
sa-music-space=Nhạc trạm vũ trụ
sa-music-hero=Bài anh hùng

[mod-setting-description]
sa-music-shuffle=Bật: trò chơi chọn bài tiếp theo ngẫu nhiên. Tắt: các bài phát theo thứ tự album. Giống nút phát ngẫu nhiên.
sa-music-show-controls=Các nút Trước, Tiếp, Ngẫu nhiên, Dừng và Tắt tiếng nhạc ở góc trên bên trái.
sa-music-show-title=Tên bài đang phát, cạnh các nút.
sa-music-placement=Chỉ Nauvis, hoặc mọi bề mặt (hữu ích với các mod thêm bề mặt riêng, như Space Exploration).
sa-music-vulcanus=Thêm các bài của Vulcanus vào danh sách phát.
sa-music-fulgora=Thêm các bài của Fulgora vào danh sách phát.
sa-music-gleba=Thêm các bài của Gleba vào danh sách phát.
sa-music-aquilo=Thêm các bài của Aquilo vào danh sách phát.
sa-music-space=Thêm các bài của trạm vũ trụ vào danh sách phát.
sa-music-hero=Năm chủ đề khi đến nơi (mỗi hành tinh một bài và một bài cho trạm vũ trụ), phát như bài thường. Không phụ thuộc vào các công tắc hành tinh ở trên.

[string-mod-setting]
sa-music-placement-nauvis=Chỉ Nauvis
sa-music-placement-all-surfaces=Mọi bề mặt

[sa-music]
no-music=(không có nhạc)
variable=(biến đổi)
previous=Bài trước
next=Bài tiếp
shuffle-on=Ngẫu nhiên: bật (trò chơi chọn bài ngẫu nhiên). Nhấp để phát theo thứ tự album.
shuffle-off=Ngẫu nhiên: tắt (các bài phát theo thứ tự album). Nhấp để trộn bài.
stop=Dừng nhạc. Nhấn Phát để nghe lại bài này.
play=Phát lại bài đã dừng từ đầu.
stopped=(đã dừng)
mute-off=Tắt tiếng nhạc. Không có nhạc cho đến khi bạn nhấp lại hoặc nhấn Trước hay Tiếp.
mute-on=Nhạc đang tắt tiếng. Nhấp để phát nhạc lại.
muted=(nhạc đã tắt tiếng)
toggle=Trình phát nhạc. Nhấp để hiện hoặc ẩn.
