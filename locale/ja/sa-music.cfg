[mod-description]
sa-music-on-nauvis=Space Age MODが無効のゲームでSpace Ageのサウンドトラックを再生します。音楽はお使いのSpace Ageのインストールからコピーされます。

[mod-setting-name]
sa-music-shuffle=音楽をシャッフル
sa-music-show-controls=音楽コントロールを表示
sa-music-show-title=曲名を表示
sa-music-placement=音楽を再生する場所
sa-music-vulcanus=ヴルカヌスの音楽
sa-music-fulgora=フルゴラの音楽
sa-music-gleba=グレバの音楽
sa-music-aquilo=アクィロの音楽
sa-music-space=宇宙プラットフォームの音楽
sa-music-hero=ヒーロー曲

[mod-setting-description]
sa-music-shuffle=オン: ゲームが次の曲をランダムに選びます。オフ: アルバム順に再生します。シャッフルボタンと同じです。
sa-music-show-controls=左上に「前へ」「次へ」「シャッフル」「停止」「音楽をミュート」ボタンを表示します。
sa-music-show-title=再生中の曲名をボタンの横に表示します。
sa-music-placement=ナウヴィスのみ、またはすべての地表 (Space Explorationのように独自の地表を追加するMODで便利です)。
sa-music-vulcanus=ヴルカヌスの曲をプレイリストに追加します。
sa-music-fulgora=フルゴラの曲をプレイリストに追加します。
sa-music-gleba=グレバの曲をプレイリストに追加します。
sa-music-aquilo=アクィロの曲をプレイリストに追加します。
sa-music-space=宇宙プラットフォームの曲をプレイリストに追加します。
sa-music-hero=5つの到着テーマ (各惑星と宇宙プラットフォームに1つずつ) を通常の曲として再生します。上の惑星スイッチとは独立しています。

[string-mod-setting]
sa-music-placement-nauvis=ナウヴィスのみ
sa-music-placement-all-surfaces=すべての地表

[sa-music]
no-music=(音楽なし)
variable=(可変)
previous=前の曲
next=次の曲
shuffle-on=シャッフル: オン (ゲームがランダムに曲を選びます)。クリックでアルバム順に再生。
shuffle-off=シャッフル: オフ (アルバム順に再生します)。クリックでシャッフル。
stop=音楽を停止します。再生を押すとこの曲をもう一度聴けます。
play=停止した曲を最初から再生します。
stopped=(停止中)
mute-off=音楽をミュートします。もう一度クリックするか、前へ・次へを押すまで音楽は流れません。
mute-on=音楽はミュート中です。クリックで再び音楽を再生します。
muted=(音楽ミュート中)
toggle=音楽プレーヤー。クリックで表示/非表示を切り替えます。
