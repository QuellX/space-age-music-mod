[mod-setting-description]
sa-music-shuffle=.בוברעה רותפכ ומכ .םובלאה רדס יפל תונגנתמ תועוצרה :יובכ .יארקאב האבה העוצרה תא רחוב קחשמה :לעפומ
sa-music-show-controls=.הנוילעה תילאמשה הניפב הקיזומ תקתשהו הריצע ,בוברע ,אבה ,םדוקה ירותפכ
sa-music-show-title=.םירותפכה דיל ,תנגנתמה העוצרה םש
sa-music-placement=.(Space Exploration ומכ ,םהלשמ םיחטשמ םיפיסומש םידומ םע ישומיש) םיחטשמה לכ וא ,דבלב סיבואנ
sa-music-vulcanus=.העמשהה תמישרל סונקלוו לש תועוצרה תפסוה
sa-music-fulgora=.העמשהה תמישרל הרוגלופ לש תועוצרה תפסוה
sa-music-gleba=.העמשהה תמישרל הבלג לש תועוצרה תפסוה
sa-music-aquilo=.העמשהה תמישרל וליקא לש תועוצרה תפסוה
sa-music-space=.העמשהה תמישרל ללחה תומרופטלפ לש תועוצרה תפסוה
sa-music-hero=.הלעמלש תכלה יבכוכ יגתמב יולת יתלב .תוליגר תועוצרכ תונגנתמ ,(ללחה תמרופטלפל תחאו תכל בכוכ לכל תחא) העגהה תומיענ שמח

[string-mod-setting]
sa-music-placement-nauvis=דבלב סיבואנ
sa-music-placement-all-surfaces=םיחטשמה לכ

