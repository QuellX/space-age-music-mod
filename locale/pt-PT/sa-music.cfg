[mod-description]
sa-music-on-nauvis=Reproduz a banda sonora do Space Age em jogos onde o mod Space Age está desativado. A música é copiada da tua própria instalação do Space Age.

[mod-setting-name]
sa-music-shuffle=Música aleatória
sa-music-show-controls=Mostrar controlos de música
sa-music-show-title=Mostrar nome da faixa
sa-music-placement=Onde reproduzir a música
sa-music-vulcanus=Música de Vulcanus
sa-music-fulgora=Música de Fulgora
sa-music-gleba=Música de Gleba
sa-music-aquilo=Música de Aquilo
sa-music-space=Música das plataformas espaciais
sa-music-hero=Faixas heroicas

[mod-setting-description]
sa-music-shuffle=Ligado: o jogo escolhe a faixa seguinte ao acaso. Desligado: as faixas tocam pela ordem do álbum. O mesmo que o botão de aleatório.
sa-music-show-controls=Botões Anterior, Seguinte, Aleatório, Parar e Silenciar música no canto superior esquerdo.
sa-music-show-title=Nome da faixa em reprodução, ao lado dos botões.
sa-music-placement=Apenas Nauvis, ou todas as superfícies (útil com mods que adicionam as suas próprias superfícies, como Space Exploration).
sa-music-vulcanus=Adicionar as faixas de Vulcanus à lista de reprodução.
sa-music-fulgora=Adicionar as faixas de Fulgora à lista de reprodução.
sa-music-gleba=Adicionar as faixas de Gleba à lista de reprodução.
sa-music-aquilo=Adicionar as faixas de Aquilo à lista de reprodução.
sa-music-space=Adicionar as faixas das plataformas espaciais à lista de reprodução.
sa-music-hero=Os cinco temas de chegada (um por planeta e um para a plataforma espacial), reproduzidos como faixas normais. Independente dos interruptores de planetas acima.

[string-mod-setting]
sa-music-placement-nauvis=Apenas Nauvis
sa-music-placement-all-surfaces=Todas as superfícies

[sa-music]
no-music=(sem música)
variable=(variável)
previous=Faixa anterior
next=Faixa seguinte
shuffle-on=Aleatório: ligado (o jogo escolhe as faixas ao acaso). Clica para reproduzir pela ordem do álbum.
shuffle-off=Aleatório: desligado (as faixas tocam pela ordem do álbum). Clica para baralhar.
stop=Parar a música. Carrega em Reproduzir para voltar a ouvir esta faixa.
play=Reproduzir de novo a faixa parada desde o início.
stopped=(parada)
mute-off=Silenciar a música. Não toca música até clicares de novo ou carregares em Anterior ou Seguinte.
mute-on=A música está silenciada. Clica para voltar a reproduzir música.
muted=(música silenciada)
toggle=Leitor de música. Clica para mostrar ou ocultar.
