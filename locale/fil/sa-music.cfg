[mod-description]
sa-music-on-nauvis=Pinatutugtog ang soundtrack ng Space Age sa mga laro kung saan naka-disable ang Space Age mod. Kinokopya ang musika mula sa sarili mong install ng Space Age.

[mod-setting-name]
sa-music-shuffle=I-shuffle ang musika
sa-music-show-controls=Ipakita ang mga kontrol ng musika
sa-music-show-title=Ipakita ang pangalan ng track
sa-music-placement=Kung saan tutugtog ang musika
sa-music-vulcanus=Musika ng Vulcanus
sa-music-fulgora=Musika ng Fulgora
sa-music-gleba=Musika ng Gleba
sa-music-aquilo=Musika ng Aquilo
sa-music-space=Musika ng mga space platform
sa-music-hero=Mga hero track

[mod-setting-description]
sa-music-shuffle=Naka-on: random na pinipili ng laro ang susunod na track. Naka-off: tumutugtog ang mga track ayon sa pagkakasunod ng album. Kapareho ng shuffle button.
sa-music-show-controls=Mga button na Nakaraan, Susunod, Shuffle, Itigil at I-mute ang musika sa kaliwang itaas na sulok.
sa-music-show-title=Pangalan ng tumutugtog na track, sa tabi ng mga button.
sa-music-placement=Nauvis lang, o lahat ng surface (kapaki-pakinabang sa mga mod na nagdadagdag ng sariling surface, gaya ng Space Exploration).
sa-music-vulcanus=Idagdag ang mga track ng Vulcanus sa playlist.
sa-music-fulgora=Idagdag ang mga track ng Fulgora sa playlist.
sa-music-gleba=Idagdag ang mga track ng Gleba sa playlist.
sa-music-aquilo=Idagdag ang mga track ng Aquilo sa playlist.
sa-music-space=Idagdag ang mga track ng mga space platform sa playlist.
sa-music-hero=Ang limang arrival theme (isa bawat planeta at isa para sa space platform), tinutugtog bilang karaniwang track. Hiwalay sa mga planet switch sa itaas.

[string-mod-setting]
sa-music-placement-nauvis=Nauvis lang
sa-music-placement-all-surfaces=Lahat ng surface

[sa-music]
no-music=(walang musika)
variable=(variable)
previous=Nakaraang track
next=Susunod na track
shuffle-on=Shuffle: naka-on (random na pinipili ng laro ang mga track). I-click para tumugtog ayon sa album.
shuffle-off=Shuffle: naka-off (tumutugtog ayon sa album). I-click para i-shuffle.
stop=Itigil ang musika. Pindutin ang Patugtugin para marinig muli ang track na ito.
play=Patugtugin muli mula sa simula ang itinigil na track.
stopped=(itinigil)
mute-off=I-mute ang musika. Walang tutugtog hanggang mag-click ka ulit o pindutin ang Nakaraan o Susunod.
mute-on=Naka-mute ang musika. I-click para tumugtog muli.
muted=(naka-mute ang musika)
toggle=Music player. I-click para ipakita o itago ito.
