[mod-description]
sa-music-on-nauvis=Mängib Space Age'i heliriba mängudes, kus Space Age'i mod on välja lülitatud. Muusika kopeeritakse sinu enda Space Age'i paigaldusest.

[mod-setting-name]
sa-music-shuffle=Juhuslik muusika
sa-music-show-controls=Näita muusika juhtnuppe
sa-music-show-title=Näita loo nime
sa-music-placement=Kus muusika mängib
sa-music-vulcanus=Vulcanuse muusika
sa-music-fulgora=Fulgora muusika
sa-music-gleba=Gleba muusika
sa-music-aquilo=Aquilo muusika
sa-music-space=Kosmoseplatvormide muusika
sa-music-hero=Kangelaslood

[mod-setting-description]
sa-music-shuffle=Sees: mäng valib järgmise loo juhuslikult. Väljas: lood mängivad albumi järjekorras. Sama mis juhuesituse nupp.
sa-music-show-controls=Nupud Eelmine, Järgmine, Juhuslik, Peata ja Vaigista muusika ülemises vasakus nurgas.
sa-music-show-title=Mängiva loo nimi nuppude kõrval.
sa-music-placement=Ainult Nauvis või kõik pinnad (kasulik modidega, mis lisavad oma pindu, nagu Space Exploration).
sa-music-vulcanus=Lisa Vulcanuse lood esitusloendisse.
sa-music-fulgora=Lisa Fulgora lood esitusloendisse.
sa-music-gleba=Lisa Gleba lood esitusloendisse.
sa-music-aquilo=Lisa Aquilo lood esitusloendisse.
sa-music-space=Lisa kosmoseplatvormide lood esitusloendisse.
sa-music-hero=Viis saabumisteemat (üks igale planeedile ja üks kosmoseplatvormile), mängitud tavaliste lugudena. Sõltumatu ülal olevatest planeedilülititest.

[string-mod-setting]
sa-music-placement-nauvis=Ainult Nauvis
sa-music-placement-all-surfaces=Kõik pinnad

[sa-music]
no-music=(muusikat pole)
variable=(muutuv)
previous=Eelmine lugu
next=Järgmine lugu
shuffle-on=Juhuesitus: sees (mäng valib lood juhuslikult). Klõpsa, et mängida albumi järjekorras.
shuffle-off=Juhuesitus: väljas (lood mängivad albumi järjekorras). Klõpsa segamiseks.
stop=Peata muusika. Vajuta Esita, et seda lugu uuesti kuulda.
play=Esita peatatud lugu uuesti algusest.
stopped=(peatatud)
mute-off=Vaigista muusika. Muusikat ei mängita, kuni klõpsad uuesti või vajutad Eelmine või Järgmine.
mute-on=Muusika on vaigistatud. Klõpsa, et muusikat uuesti mängida.
muted=(muusika vaigistatud)
toggle=Muusikamängija. Klõpsa selle näitamiseks või peitmiseks.
